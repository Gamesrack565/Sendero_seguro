openapi: 3.1.0
info:
  title: Sendero Seguro · API del servidor
  version: 0.1.0-borrador
  description: |
    Contrato de la API central (P14). Responsable: Módulo 4 de backend.

    **Estado:** borrador para revisión del equipo. Cuando se congele pasa a `1.0.0`.

    **Qué contiene:**
    - Las rutas de P5 Dispersión, P13 Auditoría, P14 Plataforma y P16 Pasarelas.
    - Las del Módulo 1 que guardan en la nube: P1 Cuentas, P2 Red de apoyo y P8 Cancelación.
    - `POST /alertas` y `POST /alertas/{id}/ubicaciones` como propuesta de referencia
      (P4 y P6 escriben `alerta` y `ubicacion_alerta`). La dispersión se engancha después
      del registro.
    - Los componentes comunes: errores, paginación y enumerados.

    Cada ruta lleva `x-proceso`.

    **Convenciones:**
    - Prefijo `/api/v1`. JSON en camelCase. Fechas ISO 8601 en UTC (`2026-10-25T05:58:01Z`).
    - Los ids de alertas, reportes, trayectos y contactos son UUID generados en el teléfono.
      Un reenvío con el mismo id no duplica: responde `200` con el recurso existente.
    - Los enumerados se mandan tal como están en la base de datos (`EN_ATENCION`, `PUSH`…).
    - Toda respuesta de error usa el esquema `Error`.
    - Paginación por cursor: `?limite=50&cursor=…`; la respuesta trae `siguienteCursor` o `null`.
    - Tiempo real por WebSocket (`/ws/consola`, `/ws/enlace/{token}`). Sus mensajes están en `README.md`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local con docker-compose
  - url: https://api.sendero-seguro.example/api/v1
    description: Nube (dominio por definir)

tags:
  - name: Cuentas
    description: P1 · registro, inicio de sesión, perfil y baja (Módulo 1)
  - name: Red de apoyo
    description: P2 · contactos de confianza, círculo escolar y avisos de vinculación (Módulo 1)
  - name: Plataforma
    description: P14 · salud y sincronización diferida
  - name: Alertas
    description: P4 registra; P5 canaliza, asigna, acusa y escala
  - name: Enlace
    description: P5 y P16 · enlace público de ubicación en vivo para la red de apoyo
  - name: Pasarelas
    description: P16 · FCM y webhooks del proveedor de SMS
  - name: Auditoría
    description: P13 · historial, timeline, bitácora, estadísticas y exportación
  - name: Archivos
    description: P15 · fotos y audios de los reportes y mapas offline, guardados en la nube

security:
  - jwt: []

paths:
  /salud:
    get:
      tags: [Plataforma]
      summary: Estado del servidor y de sus dependencias
      x-proceso: P14
      security: []
      responses:
        '200':
          description: Todo responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: Alguna dependencia no responde (mismo cuerpo, con el componente caído)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /sync/lote:
    post:
      tags: [Plataforma]
      summary: Recibe la cola offline del teléfono (RF-17, A-05)
      description: |
        El servidor procesa los elementos en este orden, sin importar cómo lleguen:
        `ALERTA` → `ACUSE` → `UBICACION` → `CANCELACION` → `REPORTE` → `TRAYECTO` → `CHECKIN`.

        La plataforma recibe el lote, lo ordena y entrega cada elemento al manejador
        registrado para su tipo. Cada elemento es independiente: si uno falla, los demás siguen.
        El `id` de cada elemento es su UUID, así que reenviar el lote completo es seguro.
        Vence sin procesarse un `ACUSE` con más de 2 horas, un `REPORTE` con más de 6 días y lo demás con
        más de 72 horas. En un `RECHAZADO`, `error.detalle.temporal` dice si el teléfono debe conservarlo y
        reintentar (`true`) o borrarlo (`false`). Los resultados vienen en el orden en que llegaron.
        El `dispositivoId` tiene que ser de la persona del token (si no, 403).
      x-proceso: P14, P11
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteSync' }
      responses:
        '200':
          description: Resultado por elemento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoLoteSync' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '413':
          description: El lote pasa de 200 elementos o de 1 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas:
    post:
      tags: [Alertas]
      summary: Registra una alerta (integrante o coordinador)
      description: |
        Idempotente por `id`. También se reconoce si antes llegó por SMS (mismo id corto y hora ±60 s).
        Sin `tipoIncidenteId`, o con uno que no está en el catálogo, se registra como genérica (RF-6).
        Una hora del teléfono en el futuro se toma como la hora actual. La primera vez responde `201` con el folio que asigna el servidor;
        un reenvío responde `200` con la misma alerta y no consume folio.

        Después de insertar, el servidor llama a la dispersión (P5)
        (canalización, asignación, red de apoyo y enlace) sin que la app espere a que termine.
        Meta: responder en 2 s o menos (RNF3).
      x-proceso: P4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaNueva' }
      responses:
        '201':
          description: Alerta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '200':
          description: Reenvío; la alerta ya existía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: El id ya existe pero pertenece a otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Alertas]
      summary: Lista de alertas para la consola (W-02)
      description: |
        Un OPERADOR solo ve las alertas asignadas a su unidad. Un ADMINISTRADOR ve todas.
        Orden: activas primero, luego por `prioridadIa` (o la del catálogo) y por antigüedad.
      x-proceso: P5
      parameters:
        - name: estado
          in: query
          description: Uno o varios estados separados por coma. `ACTIVAS` equivale a ENVIADA, ASIGNADA, ESCALADA, ACUSADA y EN_ATENCION.
          schema: { type: string, example: ACTIVAS }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de alertas
          content:
            application/json:
              schema:
                type: object
                required: [elementos, siguienteCursor]
                properties:
                  elementos:
                    type: array
                    items: { $ref: '#/components/schemas/AlertaResumen' }
                  siguienteCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /alertas/{id}:
    get:
      tags: [Alertas]
      summary: Detalle de una alerta (W-03 en la consola, A-13 en la app)
      description: |
        El emisor ve su propia alerta. El operador de una unidad asignada y el Administrador ven el detalle completo.
        Si la alerta tiene `coaccionDetectada`, el emisor la ve como CANCELADA (la pantalla simula la cancelación);
        la consola ve el estado real.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Alerta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /alertas/{id}/ubicaciones:
    post:
      tags: [Alertas]
      summary: Agrega lecturas de ubicación (propuesta de referencia)
      description: Idempotente por (`capturadaEn`, `fuente`). Cada lectura nueva se reenvía por WebSocket a la consola y al enlace.
      x-proceso: P6
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lecturas]
              properties:
                lecturas:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Ubicacion' }
      responses:
        '200':
          description: Cuántas entraron y cuántas ya existían
          content:
            application/json:
              schema:
                type: object
                required: [insertadas, duplicadas]
                properties:
                  insertadas: { type: integer }
                  duplicadas: { type: integer }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La alerta ya está cerrada o cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas/{id}/acuse:
    post:
      tags: [Alertas]
      summary: El operador acusa la alerta y se detiene el escalamiento (CU-18)
      description: Idempotente. Si ya estaba acusada responde `200` con el acuse original.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Alerta acusada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /alertas/{id}/estado:
    patch:
      tags: [Alertas]
      summary: Cambia el estado de atención (E-01)
      description: |
        Transiciones permitidas desde la consola:
        `ACUSADA → EN_ATENCION → ATENDIDA → CERRADA`.
        Para `CERRADA` son obligatorios `resultadoCierre` y la persona que cierra (sale del token).
        La cancelación por el emisor **no** va aquí: es de P8.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioEstado' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /alertas/{id}/escalar:
    post:
      tags: [Alertas]
      summary: Escalamiento manual al siguiente nivel (motivo MANUAL)
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comentario: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Nuevo escalamiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escalamiento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: No hay más pasos en la cadena de escalamiento, o la alerta ya no está activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas/{id}/timeline:
    get:
      tags: [Auditoría]
      summary: Línea de tiempo de una alerta (A-13, W-03)
      description: Une `evento_alerta`, `asignacion`, `escalamiento`, `notificacion` e `intento_cancelacion` en orden cronológico.
      x-proceso: P13
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Eventos en orden
          content:
            application/json:
              schema:
                type: object
                required: [alertaId, eventos]
                properties:
                  alertaId: { type: string, format: uuid }
                  eventos:
                    type: array
                    items: { $ref: '#/components/schemas/EventoTimeline' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /enlace/{token}:
    get:
      tags: [Enlace]
      summary: Página pública de ubicación en vivo (CU-16)
      description: |
        Sin cuenta. El token viaja en el SMS o push de la red de apoyo; el servidor solo guarda su hash.
        No muestra datos del perfil (X-01). Para recibir actualizaciones se abre `WS /ws/enlace/{token}`.
      x-proceso: P5, P16
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Enlace vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnlacePublico' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '410':
          description: El enlace venció o se revocó porque la alerta se cerró o canceló
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispositivos/{id}/push:
    put:
      tags: [Pasarelas]
      summary: Registra o renueva el token de FCM del dispositivo
      description: Solo el dueño del dispositivo. La app lo llama al iniciar sesión y cada vez que FCM rota el token.
      x-proceso: P16
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken: { type: string, minLength: 20, maxLength: 4096 }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /archivos/{tipo}:
    post:
      tags: [Archivos]
      summary: Sube una foto o audio de un reporte, o un paquete de mapas
      description: |
        El cuerpo es el archivo tal cual (no multipart), con su `Content-Type`. El servidor lo guarda en el almacén
        (Azure Blob Storage en la nube) y responde la clave, el tamaño y el SHA-256. El módulo que lo usa los guarda en
        `evidencia` (`url_objeto`, `mime`, `tamano_bytes`, `hash_sha256`) o en `paquete_mapa` (`ruta_archivo`, …).

        - `evidencia`: cualquier cuenta. `image/jpeg`, `image/png`, `image/webp`, `audio/mpeg`, `audio/mp4`,
          `audio/aac` o `audio/ogg`. Hasta 10 MB.
        - `mapa`: solo el Administrador. `application/zip` o `application/octet-stream`. Hasta 200 MB.
      x-proceso: P15
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [evidencia, mapa] }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoGuardado' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: Pasa del tamaño máximo (`MUY_GRANDE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: El `Content-Type` no está permitido para ese tipo (`TIPO_NO_PERMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /archivos/{tipo}/{nombre}:
    get:
      tags: [Archivos]
      summary: Descarga un archivo
      description: Cualquier cuenta con sesión. `nombre` es la parte final de la clave (`<uuid>.<extensión>`). El archivo no cambia nunca, así que se puede guardar en caché.
      x-proceso: P15
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [evidencia, mapa] }
        - name: nombre
          in: path
          required: true
          schema: { type: string, example: 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg }
      responses:
        '200':
          description: El archivo, con su `Content-Type`
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /pasarela/sms/entrante:
    post:
      tags: [Pasarelas]
      summary: Webhook de Twilio para SMS recibidos (CU-25)
      description: |
        Lo llama Twilio cuando llega un SMS a su número, no la app. Se valida con `X-Twilio-Signature`.

        Cada mensaje se guarda en `mensaje_sms`, válido o no. Si es un `SS1|…` válido de una cuenta activa,
        se registra la alerta con `canalRecepcion = SMS` y sigue el mismo flujo de dispersión; si la alerta
        ya existía (mismo id corto y hora ±60 s), solo se liga a ella. El formato `SS1` está en `README.md`.
        Siempre responde `200` para que Twilio no reintente un mensaje que ya se guardó: TwiML vacío
        (no se contesta nada al teléfono), o JSON si la petición pide `Accept: application/json`.
      x-proceso: P16, P5
      security:
        - firmaTwilio: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/SmsEntrante' }
      responses:
        '200':
          description: Mensaje guardado
          content:
            text/xml:
              schema: { type: string, example: '<?xml version="1.0" encoding="UTF-8"?><Response></Response>' }
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  mensajeId: { type: [integer, 'null'], format: int64, description: Nulo si el remitente no es un número de teléfono }
                  valido: { type: boolean }
                  alertaId: { type: [string, 'null'], format: uuid, description: Nulo si no es válido o si el registro está pendiente }
        '401':
          description: Firma de Twilio inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pasarela/sms/estado:
    post:
      tags: [Pasarelas]
      summary: Webhook de Twilio con el estado de entrega de un SMS enviado
      description: |
        Twilio lo llama para cada SMS que mandó el servidor (`StatusCallback`). Actualiza `notificacion` (E-03)
        buscando por `proveedor_mensaje_id = MessageSid`:
        `sent` deja de esperar la confirmación, `delivered` pasa a `ENTREGADA`, y `undelivered` o `failed`
        pasa a `FALLIDA` (se reintenta) o a `DESCARTADA` con los errores 30004, 30005 y 30006.
        Los demás estados se ignoran.
      x-proceso: P16
      security:
        - firmaTwilio: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, MessageStatus]
              properties:
                MessageSid: { type: string, maxLength: 120 }
                MessageStatus: { type: string, enum: [queued, sending, sent, delivered, undelivered, failed] }
                ErrorCode: { type: string }
      responses:
        '204': { description: Actualizado (o ignorado si no se encontró) }
        '401':
          description: Firma de Twilio inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pasarela/smsgate:
    post:
      tags: [Pasarelas]
      summary: Webhook del celular Android que funciona como pasarela SMS
      description: |
        Lo llama la app SMS Gateway for Android (docs.sms-gate.app) instalada en el celular pasarela, no la app
        de Sendero Seguro. Es la alternativa gratuita a Twilio: se activa con `AVISOS_PROVEEDOR_SMS=smsgate`.
        Una sola ruta recibe todos los eventos registrados en la app:

        - `sms:received`: un SMS que llegó al chip. Sigue el mismo flujo que `/pasarela/sms/entrante`
          (`mensaje_sms`, `SS1`, registro o liga de la alerta) y responde `200` con el resultado.
        - `sms:sent`: deja de esperar la confirmación. `sms:delivered`: el aviso pasa a `ENTREGADA`.
          `sms:failed`: pasa a `FALLIDA` y se reintenta. Se busca por `proveedor_mensaje_id = payload.messageId`.
        - Cualquier otro evento (`system:ping`...) responde `204` y se ignora.

        La app reintenta mientras no reciba un `2xx`.
      x-proceso: P16, P5
      security:
        - firmaSmsGate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoSmsGate' }
      responses:
        '200':
          description: SMS recibido y guardado (`sms:received`)
          content:
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  mensajeId: { type: [integer, 'null'], format: int64 }
                  valido: { type: boolean }
                  alertaId: { type: [string, 'null'], format: uuid }
        '204': { description: Estado actualizado, o evento ignorado }
        '400':
          description: El aviso no trae `event` y `payload`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Firma inválida o `X-Timestamp` con más de 5 minutos de diferencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: En la nube sin `SMSGATE_LLAVE_FIRMA`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /historial:
    get:
      tags: [Auditoría]
      summary: Historial propio (alertas, reportes con nombre y trayectos)
      description: Lee `v_historial_usuario` de la persona del token. Los reportes anónimos no aparecen. Una alerta cancelada con el PIN de coacción sale como `CANCELADA`.
      x-proceso: P13
      parameters:
        - name: tipo
          in: query
          schema: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página del historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaHistorial' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /usuarios/{id}/historial:
    get:
      tags: [Auditoría]
      summary: Historial de otra persona (solo Administrador, con justificación)
      description: La consulta y su justificación quedan en `bitacora` (`CONSULTAR_HISTORIAL_AJENO`). Muestra el estado real de cada alerta.
      x-proceso: P13
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Justificacion
          in: header
          required: true
          schema: { type: string, minLength: 10, maxLength: 500 }
        - name: tipo
          in: query
          schema: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página del historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaHistorial' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /bitacora:
    get:
      tags: [Auditoría]
      summary: Consulta de la bitácora (solo Administrador)
      x-proceso: P13
      parameters:
        - name: accion
          in: query
          schema: { type: string }
        - name: entidad
          in: query
          schema: { type: string }
        - name: entidadId
          in: query
          schema: { type: string }
        - name: usuarioId
          in: query
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de registros
          content:
            application/json:
              schema:
                type: object
                required: [elementos, siguienteCursor]
                properties:
                  elementos:
                    type: array
                    items: { $ref: '#/components/schemas/RegistroBitacora' }
                  siguienteCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /bitacora/verificar:
    get:
      tags: [Auditoría]
      summary: Verifica la cadena de hashes de la bitácora (solo Administrador)
      description: Llama `fn_verificar_bitacora()`. `integra` es verdadero si no hay registros alterados.
      x-proceso: P13
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                type: object
                required: [integra, registrosRevisados, primerIdAlterado, verificadaEn]
                properties:
                  integra: { type: boolean }
                  registrosRevisados: { type: integer, format: int64 }
                  primerIdAlterado: { type: [integer, 'null'], format: int64 }
                  verificadaEn: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /estadisticas/alertas:
    get:
      tags: [Auditoría]
      summary: Indicadores de alertas para el tablero (RF-26, W-08), solo Administrador
      description: |
        Sale de `v_alerta_tiempos`. Sin datos personales. El periodo va por días completos en la hora de la
        Ciudad de México y no puede pasar de 366 días. La zona se toma de la primera ubicación de la alerta.
        `pctCumpleMetaAcuse` cuenta las alertas acusadas y las que pasaron la meta sin acuse.
      x-proceso: P13
      parameters:
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroTipo'
        - $ref: '#/components/parameters/FiltroZona'
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estadisticas' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /estadisticas/exportar:
    get:
      tags: [Auditoría]
      summary: Exporta las estadísticas en CSV (X-02) o PDF tamaño carta (X-03), solo Administrador
      description: |
        Mismos filtros y números que `/estadisticas/alertas`. Cada exportación queda en `bitacora` como
        `EXPORTAR_ESTADISTICAS`. El archivo llega como descarga (`Content-Disposition: attachment`). El CSV
        tiene una fila por dato (`seccion,concepto,valor,mediana_acuse_seg`) en UTF-8 con BOM.
      x-proceso: P13
      parameters:
        - name: formato
          in: query
          required: true
          schema: { type: string, enum: [csv, pdf] }
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroTipo'
        - $ref: '#/components/parameters/FiltroZona'
      responses:
        '200':
          description: Archivo
          content:
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ------------------------------------------------------------------ Módulo 1: P1 Cuentas
  /avisos-privacidad/vigente:
    get:
      tags: [Cuentas]
      summary: Aviso de privacidad vigente (lo acepta la persona al registrarse)
      x-proceso: P1
      security: []
      responses:
        '200':
          description: Aviso vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoPrivacidad' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /instituciones:
    get:
      tags: [Cuentas]
      summary: Instituciones activas, para el registro
      x-proceso: P1
      security: []
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Institucion' } }

  /instituciones/{id}/escuelas:
    get:
      tags: [Cuentas]
      summary: Escuelas activas de una institución
      x-proceso: P1
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Escuela' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /auth/registro:
    post:
      tags: [Cuentas]
      summary: Crea la cuenta, guarda el consentimiento y el teléfono, y abre la sesión (CU-01)
      description: |
        La contraseña se guarda con Argon2id. `tipoComunidad = DOCENTE` crea la cuenta como COORDINADOR; las demás
        como INTEGRANTE. Los errores de validación traen `detalle.errores` con la misma clave de campo que usa la app
        (`nombre`, `telefono`, `identificador`, `escuela`, `carrera`, `contrasena`, `tipoComunidad`,
        `consentimiento`, `dispositivo`).
      x-proceso: P1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registro' }
      responses:
        '201':
          description: Cuenta creada y sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /auth/login:
    post:
      tags: [Cuentas]
      summary: Inicia sesión con teléfono (10 dígitos) o matrícula (CU-02)
      description: |
        Sin `dispositivo` es la consola web; con `dispositivo` es la app, donde OPERADOR y ADMINISTRADOR no pueden
        entrar (`403 PERFIL_NO_PERMITIDO`, con `detalle.rol`). Al 5.º intento fallido (`login_max_intentos`) la cuenta
        queda bloqueada `login_bloqueo_minutos` (15).
      x-proceso: P1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401':
          description: '`CREDENCIALES_INVALIDAS`, con `detalle.intentosRestantes` si la cuenta existe'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: '`CUENTA_SUSPENDIDA` (suspendida o dada de baja) o `PERFIL_NO_PERMITIDO`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '423':
          description: '`CUENTA_BLOQUEADA`, con `detalle.bloqueadaHasta`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/logout:
    post:
      tags: [Cuentas]
      summary: Cierra la sesión del token; desde ese momento el token responde 401
      x-proceso: P1
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /usuarios/me:
    get:
      tags: [Cuentas]
      summary: Perfil de quien tiene la sesión
      x-proceso: P1
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    patch:
      tags: [Cuentas]
      summary: Cambia teléfono, matrícula, carrera o el permiso de entrenamiento de IA (CU-03)
      description: Solo se cambian los campos que llegan.
      x-proceso: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilCambio' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /usuarios/me/baja:
    post:
      tags: [Cuentas]
      summary: Pide la baja de la cuenta (derecho ARCO de cancelación)
      description: Pide la contraseña. La cuenta queda BAJA_SOLICITADA, se cierran todas sus sesiones y se crea la solicitud ARCO.
      x-proceso: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena]
              properties:
                contrasena: { type: string }
      responses:
        '204': { description: Baja solicitada }
        '401': { description: Contraseña incorrecta o sin token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------------------ Módulo 1: P2 Red de apoyo
  /contactos:
    get:
      tags: [Red de apoyo]
      summary: Contactos de confianza activos, por prioridad
      x-proceso: P2
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /contactos/{id}:
    put:
      tags: [Red de apoyo]
      summary: Agrega o edita un contacto (idempotente; el id lo genera el teléfono)
      description: |
        Queda CONFIRMADO. Si el teléfono es de una cuenta, el servidor llena `usuarioVinculadoId` y pone
        `canalPreferido = PUSH`. El mismo número dos veces en la lista responde `409 DUPLICADO` (`detalle.errores.telefono`).
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactoEntrada' }
      responses:
        '200':
          description: Contacto guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Duplicado' }
    delete:
      tags: [Red de apoyo]
      summary: Quita un contacto (idempotente; 204 aunque ya no exista)
      description: Si ya recibió algún aviso queda inactivo en lugar de borrarse, para conservar el historial.
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Quitado }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /contactos/orden:
    put:
      tags: [Red de apoyo]
      summary: Reordena los contactos; quedan con prioridad 1..n
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, description: Todos los contactos activos, en el orden nuevo }
      responses:
        '200':
          description: Contactos en el orden nuevo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /circulos/mio:
    get:
      tags: [Red de apoyo]
      summary: El círculo escolar de la persona, o `{}` si no está en ninguno
      x-proceso: P2
      responses:
        '200':
          description: Círculo
          content:
            application/json:
              schema:
                type: object
                properties:
                  circulo: { $ref: '#/components/schemas/Circulo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /circulos:
    post:
      tags: [Red de apoyo]
      summary: Crea un círculo (solo COORDINADOR); el servidor genera el código y su vigencia
      description: |
        Código con formato AAA-999 (sin 0, O, 1, I ni L), válido `codigo_invitacion_dias` (7). El coordinador queda
        como integrante. Un reenvío con el mismo id responde el mismo círculo. Cada persona está en un solo círculo.
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, nombreGrupo]
              properties:
                id: { type: string, format: uuid }
                nombreGrupo: { type: string, minLength: 3, maxLength: 100 }
      responses:
        '201':
          description: Círculo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: Ya pertenece a un círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/unirse:
    post:
      tags: [Red de apoyo]
      summary: Se une a un círculo con su código (acepta minúsculas y sin guion)
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, example: K7Q-42M }
      responses:
        '200':
          description: Círculo al que se unió (sin el código, que solo ve el coordinador)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { description: '`CODIGO_INVALIDO`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Ya pertenece a otro círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: '`CODIGO_VENCIDO`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/{id}/codigo:
    post:
      tags: [Red de apoyo]
      summary: Genera un código nuevo (solo su coordinador); el anterior deja de servir
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Círculo con el código nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /circulos/{id}/miembros:
    get:
      tags: [Red de apoyo]
      summary: Integrantes del círculo con su último estado (solo integrantes activos lo ven)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista, primero los activos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /circulos/{id}/miembros/{usuarioId}:
    delete:
      tags: [Red de apoyo]
      summary: Da de baja a un integrante (solo su coordinador; queda DADA_DE_BAJA)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dado de baja (o ya no estaba) }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: El coordinador no puede darse de baja a sí mismo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/{id}/retirarme:
    post:
      tags: [Red de apoyo]
      summary: Sale del círculo (queda RETIRADA)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Retirada (o ya no estaba) }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { description: El coordinador no puede retirarse de su círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /red-apoyo/avisos:
    post:
      tags: [Red de apoyo]
      summary: Avisa de una vinculación nueva (X-01)
      description: |
        `CONTACTO_AGREGADO` manda un SMS al contacto; `NUEVO_INTEGRANTE` manda un push (o SMS) al coordinador.
        La misma petición en menos de un día no crea otro aviso.
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { type: string, enum: [CONTACTO_AGREGADO, NUEVO_INTEGRANTE] }
                contactoId: { type: string, format: uuid, description: Para CONTACTO_AGREGADO }
                circuloId: { type: string, format: uuid, description: Para NUEVO_INTEGRANTE }
      responses:
        '202': { description: Aviso en cola }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Módulo 1: P8 Cancelación
  /alertas/{id}/cancelaciones:
    post:
      tags: [Alertas]
      summary: Cancela la alerta, o registra un PIN que no coincide como posible coacción (CU-21)
      description: |
        Solo quien envió la alerta. El PIN se verifica en el teléfono.
        - `exitoso: true`: la alerta pasa a CANCELADA y se avisa a la unidad y a la red de apoyo.
        - `exitoso: false`: la alerta **sigue activa**, queda `coaccionDetectada` y la consola lo ve. A quien la envió
          se le muestra como CANCELADA.
        Idempotente: el mismo intento (misma alerta y mismo `intentadoEn`) no se guarda dos veces. Si la alerta ya
        terminó, el intento se guarda y no cambia nada.
      x-proceso: P8
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cancelacion' }
      responses:
        '204': { description: Registrado }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso firmado por el servidor; lo entregan `POST /auth/registro` y `POST /auth/login`.
        Reclamos: `sub` (usuario.id), `rol` (INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR),
        `disp` (dispositivo.id, solo en la app), `sid` (sesion.id), `exp`.
        Dura `JWT_SESION_DIAS` (30 días). `POST /auth/logout` lo invalida en ese momento.
    firmaTwilio:
      type: apiKey
      in: header
      name: X-Twilio-Signature
      description: |
        Base64 de HMAC-SHA1 con el Auth Token de Twilio sobre la URL pública del webhook seguida de cada
        campo del formulario (nombre y valor, ordenados por nombre).

    firmaSmsGate:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 en hexadecimal, con la llave de firma de la app (`SMSGATE_LLAVE_FIRMA`), del cuerpo tal como
        llega seguido del encabezado `X-Timestamp` (segundos Unix, ±5 minutos de la hora del servidor).

  parameters:
    IdAlerta:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      description: Token aleatorio de 32 bytes en base64url (43 caracteres)
      schema: { type: string, minLength: 43, maxLength: 43 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    FiltroDesde:
      name: desde
      in: query
      required: true
      schema: { type: string, format: date }
    FiltroHasta:
      name: hasta
      in: query
      required: true
      schema: { type: string, format: date }
    FiltroTipo:
      name: tipoIncidenteId
      in: query
      schema: { type: integer }
    FiltroZona:
      name: zonaId
      in: query
      description: zona_geografica.id
      schema: { type: integer }

  responses:
    Invalido:
      description: El cuerpo o los parámetros no son válidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: VALIDACION
            mensaje: La latitud debe estar entre -90 y 90
            detalle: { campo: ubicacion.latitud }
    NoAutenticado:
      description: Falta el token o venció
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El rol del token no puede hacer esto
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: No existe (o no es visible para quien pregunta)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Duplicado:
      description: El dato ya está registrado (`DUPLICADO`); `detalle.errores` dice qué campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: DUPLICADO
            mensaje: Ese dato ya está registrado en otra cuenta
            detalle: { errores: { telefono: Ese dato ya está registrado en otra cuenta } }
    TransicionInvalida:
      description: El cambio de estado no está permitido desde el estado actual (E-01)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: No se puede pasar de ENVIADA a ATENDIDA
            detalle: { estadoActual: ENVIADA, estadoPedido: ATENDIDA }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código estable en mayúsculas, para que la app decida qué hacer
          enum: [VALIDACION, NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, DUPLICADO,
                 TRANSICION_INVALIDA, VENCIDO, DEMASIADAS_PETICIONES, ERROR_INTERNO,
                 CREDENCIALES_INVALIDAS, CUENTA_BLOQUEADA, CUENTA_SUSPENDIDA, PERFIL_NO_PERMITIDO,
                 CODIGO_INVALIDO, CODIGO_VENCIDO]
        mensaje: { type: string, description: Texto para mostrar o registrar }
        detalle: { type: object, additionalProperties: true }

    Salud:
      type: object
      required: [estado, version, componentes]
      properties:
        estado: { type: string, enum: [OK, DEGRADADO, CAIDO] }
        version: { type: string, example: 0.1.0 }
        componentes:
          type: object
          properties:
            baseDatos: { type: string, enum: [OK, CAIDO] }
            redis: { type: string, enum: [OK, CAIDO] }
            almacenObjetos: { type: string, enum: [OK, CAIDO] }

    # ---- Enumerados (copiados de la base de datos) ----
    AlertaEstado:
      type: string
      enum: [CREADA, EN_CUENTA_REGRESIVA, PENDIENTE_ENVIO, EXPIRADA, ENVIADA, ASIGNADA,
             ESCALADA, ACUSADA, EN_ATENCION, ATENDIDA, CERRADA, CANCELADA]
    CanalRecepcion:
      type: string
      enum: [INTERNET, MALLA, SMS]
    Detonador:
      type: string
      enum: [BOTON, ATAJO_FISICO, WIDGET, VOZ, CAIDA, TEMPORIZADOR]
    FuenteUbicacion:
      type: string
      enum: [GNSS, WIFI, CELULAR, ULTIMA_CONOCIDA]
    AsignacionRol:
      type: string
      enum: [PRINCIPAL, INFORMATIVA]
    DestinoEscalamiento:
      type: string
      enum: [OPERADOR, CORPORACION, COORDINADOR_CIRCULO]
    NotificacionCanal:
      type: string
      enum: [PUSH, SMS, WHATSAPP]
    NotificacionEstado:
      type: string
      enum: [PENDIENTE, ENVIADA, ENTREGADA, FALLIDA, DESCARTADA]

    Ubicacion:
      type: object
      required: [latitud, longitud, fuente, capturadaEn]
      properties:
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        precisionM: { type: number, minimum: 0 }
        velocidadMs: { type: number, minimum: 0 }
        rumboGrados: { type: integer, minimum: 0, maximum: 359 }
        bateria: { type: integer, minimum: 0, maximum: 100 }
        fuente: { $ref: '#/components/schemas/FuenteUbicacion' }
        capturadaEn: { type: string, format: date-time }

    AlertaNueva:
      type: object
      required: [id, activadaEn, ubicacion]
      properties:
        id: { type: string, format: uuid, description: UUID generado en el teléfono }
        tipoIncidenteId: { type: integer, description: Sin él (o si no existe) se registra como genérica (RF-6) }
        versionCatalogoId: { type: integer, description: Versión del catálogo que tenía el teléfono; sin ella se usa la publicada }
        tipoSugeridoId: { type: integer, description: Sugerencia de IA-1; va junto con confianzaSugerencia }
        confianzaSugerencia: { type: number, minimum: 0, maximum: 1 }
        descripcion: { type: string, maxLength: 2000 }
        canalRecepcion: { allOf: [{ $ref: '#/components/schemas/CanalRecepcion' }], description: Sin él, INTERNET }
        saltosMalla: { type: integer, minimum: 0, description: Solo si llegó por malla }
        firmaPaquete: { type: string, description: Solo si llegó por malla; se acepta y no se guarda }
        detonador: { allOf: [{ $ref: '#/components/schemas/Detonador' }], description: Sin él, BOTON }
        nivelBateria: { type: integer, minimum: 0, maximum: 100 }
        trayectoId: { type: string, format: uuid, description: Trayecto cuyo temporizador la activó; si va, debe ser de la persona }
        activadaEn: { type: string, format: date-time, description: Reloj del teléfono }
        enviadaEn: { type: string, format: date-time }
        ubicacion: { allOf: [{ $ref: '#/components/schemas/Ubicacion' }], description: 'Aquí fuente y capturadaEn son opcionales: sin ellas, GNSS y activadaEn' }

    AlertaRegistrada:
      type: object
      required: [id, folio, estado, registradaEn]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: ALR-2026-000001 }
        estado: { $ref: '#/components/schemas/AlertaEstado' }
        registradaEn: { type: string, format: date-time }
        enlaceSeguimiento:
          type: [string, 'null']
          description: URL pública para compartir; null mientras la dispersión aún no la genera
          example: https://sendero-seguro.example/e/3q2-…

    AlertaResumen:
      type: object
      required: [id, folio, estado, tipoIncidente, canalRecepcion, activadaEn, nivelEscalamiento]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        estado: { $ref: '#/components/schemas/AlertaEstado' }
        tipoIncidente: { $ref: '#/components/schemas/TipoIncidenteRef' }
        prioridad:
          type: integer
          description: prioridadIa (0–100) si IA-4 respondió; si no, se deriva de la prioridad del catálogo
        canalRecepcion: { $ref: '#/components/schemas/CanalRecepcion' }
        activadaEn: { type: string, format: date-time }
        acuseLimiteEn: { type: [string, 'null'], format: date-time }
        nivelEscalamiento: { type: integer }
        sinAcuse: { type: boolean }
        ultimaUbicacion:
          oneOf:
            - $ref: '#/components/schemas/Ubicacion'
            - type: 'null'

    AlertaDetalle:
      allOf:
        - $ref: '#/components/schemas/AlertaResumen'
        - type: object
          properties:
            emisor:
              type: object
              description: Solo para la consola. La app del emisor no recibe este bloque.
              properties:
                nombre: { type: string }
                telefonoMovil: { type: string }
                identificadorInstitucional: { type: string }
                escuela: { type: string }
            descripcion: { type: [string, 'null'] }
            detonador: { $ref: '#/components/schemas/Detonador' }
            nivelBateria: { type: [integer, 'null'] }
            coaccionDetectada: { type: boolean, description: Solo para la consola }
            prioridadMotivos: { type: array, items: { type: string } }
            asignaciones:
              type: array
              items: { $ref: '#/components/schemas/Asignacion' }
            registradaEn: { type: string, format: date-time }
            acusadaEn: { type: [string, 'null'], format: date-time }
            cerradaEn: { type: [string, 'null'], format: date-time }
            resultadoCierre: { type: [string, 'null'] }
            canceladaEn: { type: [string, 'null'], format: date-time }

    TipoIncidenteRef:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        categoria: { type: [string, 'null'], enum: [FISICO, SOCIAL, DIGITAL, null] }
        esGenerica: { type: boolean }

    Asignacion:
      type: object
      required: [unidadId, unidadNombre, corporacion, rol, nivelEscalamiento, asignadaEn]
      properties:
        unidadId: { type: string, format: uuid }
        unidadNombre: { type: string }
        corporacion: { type: string }
        rol: { $ref: '#/components/schemas/AsignacionRol' }
        nivelEscalamiento: { type: integer }
        distanciaM: { type: [number, 'null'] }
        asignadaEn: { type: string, format: date-time }
        liberadaEn: { type: [string, 'null'], format: date-time }

    Escalamiento:
      type: object
      required: [nivel, destinoTipo, motivo, escaladaEn]
      properties:
        nivel: { type: integer, minimum: 1 }
        destinoTipo: { $ref: '#/components/schemas/DestinoEscalamiento' }
        corporacion: { type: [string, 'null'] }
        operadorId: { type: [string, 'null'], format: uuid }
        motivo: { type: string, enum: [SIN_ACUSE, MANUAL] }
        escaladaEn: { type: string, format: date-time }

    CambioEstado:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [EN_ATENCION, ATENDIDA, CERRADA] }
        resultadoCierre: { type: string, maxLength: 500, description: Obligatorio si estado = CERRADA }
        observaciones: { type: string, maxLength: 2000 }

    EventoTimeline:
      type: object
      required: [tipo, ocurridoEn]
      properties:
        tipo:
          type: string
          enum: [CAMBIO_ESTADO, ASIGNACION, ESCALAMIENTO, NOTIFICACION, INTENTO_CANCELACION]
        ocurridoEn: { type: string, format: date-time }
        actor: { type: [string, 'null'], description: Nombre o rol de quien lo hizo; null si fue el sistema }
        estadoAnterior: { $ref: '#/components/schemas/AlertaEstado' }
        estadoNuevo: { $ref: '#/components/schemas/AlertaEstado' }
        detalle: { type: object, additionalProperties: true }

    EnlacePublico:
      type: object
      required: [tipo, venceEn, activa]
      properties:
        tipo: { type: string, enum: [ALERTA, TRAYECTO] }
        primerNombre: { type: string, description: Solo el primer nombre del emisor, para que el contacto sepa de quién es }
        estado: { type: string, description: Estado legible (Enviada, En atención…), sin detalles internos }
        venceEn: { type: string, format: date-time }
        activa: { type: boolean }
        ultimaUbicacion:
          oneOf:
            - $ref: '#/components/schemas/Ubicacion'
            - type: 'null'
        websocket: { type: string, example: wss://api.sendero-seguro.example/api/v1/ws/enlace/… }

    SmsEntrante:
      type: object
      description: Campos que manda Twilio (manda más, y se ignoran).
      required: [From, Body]
      properties:
        From: { type: string, description: 'Número de origen en formato internacional, por ejemplo +525512345678' }
        Body: { type: string, description: Texto del SMS; se guardan hasta 160 caracteres }
        MessageSid: { type: string }

    AvisoSmsGate:
      type: object
      description: Aviso de la app SMS Gateway for Android (manda más campos, y se ignoran).
      required: [event, payload]
      properties:
        event: { type: string, example: 'sms:received' }
        deviceId: { type: string }
        id: { type: string }
        webhookId: { type: string }
        payload:
          type: object
          properties:
            messageId: { type: string, description: 'Id del mensaje; en los de estado, el que mandó el servidor' }
            message: { type: string, description: Texto del SMS (`sms:received`) }
            sender: { type: string, description: Número de origen (`sms:received`) }
            reason: { type: string, description: Motivo de la falla (`sms:failed`) }

    LoteSync:
      type: object
      required: [dispositivoId, elementos]
      properties:
        dispositivoId: { type: string, format: uuid }
        elementos:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ElementoSync' }

    ElementoSync:
      type: object
      required: [tipo, id, creadoEn, datos]
      properties:
        tipo: { type: string, enum: [ALERTA, ACUSE, UBICACION, CANCELACION, REPORTE, TRAYECTO, CHECKIN] }
        id: { type: string, format: uuid, description: Id de cola_sincronizacion en el teléfono }
        creadoEn: { type: string, format: date-time }
        datos:
          type: object
          description: |
            El mismo cuerpo que la ruta normal de ese tipo. Por ejemplo, para ALERTA es `AlertaNueva`;
            para UBICACION es `{ alertaId, lecturas[] }`. Cada módulo documenta el suyo.
          additionalProperties: true

    ResultadoLoteSync:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          items:
            type: object
            required: [id, resultado]
            properties:
              id: { type: string, format: uuid }
              resultado:
                type: string
                enum: [ACEPTADO, DUPLICADO, RECHAZADO, VENCIDO]
                description: El teléfono borra de su cola todo lo que no sea RECHAZADO con error temporal
              error: { $ref: '#/components/schemas/Error' }
              referencia: { type: string, description: 'Folio asignado, por ejemplo ALR-2026-000001' }

    ElementoHistorial:
      type: object
      required: [tipo, id, estado, ocurridoEn]
      properties:
        tipo: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        id: { type: string, format: uuid }
        referencia: { type: [string, 'null'], description: Folio; null en trayectos }
        estado: { type: string }
        ocurridoEn: { type: string, format: date-time }

    PaginaHistorial:
      type: object
      required: [elementos, siguienteCursor]
      properties:
        elementos:
          type: array
          items: { $ref: '#/components/schemas/ElementoHistorial' }
        siguienteCursor: { type: [string, 'null'] }

    RegistroBitacora:
      type: object
      required: [id, ocurridaEn, accion, hash]
      properties:
        id: { type: integer, format: int64 }
        ocurridaEn: { type: string, format: date-time }
        usuarioId: { type: [string, 'null'], format: uuid }
        accion: { type: string, example: EXPORTAR_ESTADISTICAS }
        entidad: { type: [string, 'null'] }
        entidadId: { type: [string, 'null'] }
        detalle: { type: object, additionalProperties: true }
        ip: { type: [string, 'null'] }
        hash: { type: string, description: SHA-256 en hexadecimal }

    Estadisticas:
      type: object
      required: [periodo, totalAlertas, porEstado, porTipo, porSemana]
      properties:
        periodo:
          type: object
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
        totalAlertas: { type: integer }
        medianaAcuseSeg: { type: [integer, 'null'] }
        pctCumpleMetaAcuse: { type: [number, 'null'], description: Porcentaje que acusó dentro de meta_acuse_seg (120 s) }
        pctEscaladas: { type: number }
        pctCanceladas: { type: number }
        porCanal:
          type: object
          additionalProperties: { type: integer }
          example: { INTERNET: 120, MALLA: 8, SMS: 3 }
        porEstado:
          type: object
          additionalProperties: { type: integer }
        porTipo:
          type: array
          items:
            type: object
            properties:
              tipoIncidenteId: { type: integer }
              nombre: { type: string }
              total: { type: integer }
              medianaAcuseSeg: { type: [integer, 'null'] }
        porSemana:
          type: array
          items:
            type: object
            properties:
              semana: { type: string, example: 2026-W43 }
              total: { type: integer }

    ArchivoGuardado:
      type: object
      required: [clave, url, mime, tamanoBytes, hashSha256]
      properties:
        clave: { type: string, example: evidencia/3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg, description: Va en `evidencia.url_objeto` o `paquete_mapa.ruta_archivo` }
        url: { type: string, example: /archivos/evidencia/3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg, description: Ruta de descarga, relativa a /api/v1 }
        mime: { type: string, example: image/jpeg }
        tamanoBytes: { type: integer, example: 482113 }
        hashSha256: { type: string, example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }

    # ---------------------------------------------------------------- Módulo 1 (P1, P2, P8)
    AvisoPrivacidad:
      type: object
      required: [id, version, contenidoHash]
      properties:
        id: { type: integer }
        version: { type: string }
        contenidoHash: { type: string, description: SHA-256 del texto del aviso }
    Institucion:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        siglas: { type: string }
    Escuela:
      type: object
      required: [id, institucionId, nombre]
      properties:
        id: { type: integer }
        institucionId: { type: integer }
        nombre: { type: string }
    Dispositivo:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, description: Lo genera la app y no cambia entre sesiones }
        modelo: { type: string }
        androidApi: { type: integer, minimum: 26 }
        soportaWifiAware: { type: boolean, default: false }
    Registro:
      type: object
      required: [nombre, telefonoMovil, identificadorInstitucional, tipoComunidad, escuelaId, contrasena, consentimiento, dispositivo]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120, description: Solo letras y espacios }
        telefonoMovil: { type: string, example: '5512345678', description: 10 dígitos; acepta espacios, guiones y +52 }
        identificadorInstitucional: { type: string, pattern: '^[A-Za-z0-9]{6,15}$', description: Matrícula o número de empleado }
        tipoComunidad: { type: string, enum: [ALUMNO, DOCENTE, PERSONAL] }
        escuelaId: { type: integer }
        carreraAdscripcion: { type: string, minLength: 3, maxLength: 120 }
        contrasena: { type: string, minLength: 8, maxLength: 128, description: Al menos una letra y un número }
        aceptaEntrenamientoIa: { type: boolean, default: false }
        consentimiento:
          type: object
          required: [avisoId]
          properties:
            avisoId: { type: integer }
            aceptadoEn: { type: string, format: date-time }
        dispositivo: { $ref: '#/components/schemas/Dispositivo' }
    Login:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario: { type: string, description: Teléfono (10 dígitos) o matrícula }
        contrasena: { type: string }
        dispositivo: { $ref: '#/components/schemas/Dispositivo' }
    Usuario:
      type: object
      required: [id, nombre, telefonoMovil, identificadorInstitucional, escuelaId, rol, estado, aceptaEntrenamientoIa]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        telefonoMovil: { type: string }
        identificadorInstitucional: { type: string }
        escuelaId: { type: integer }
        carreraAdscripcion: { type: string }
        rol: { type: string, enum: [INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR] }
        estado: { type: string, enum: [ACTIVA, BLOQUEADA_TEMPORAL, SUSPENDIDA, BAJA_SOLICITADA, ELIMINADA] }
        aceptaEntrenamientoIa: { type: boolean }
    Sesion:
      type: object
      required: [token, expiraEn, usuario]
      properties:
        token: { type: string, description: JWT para el encabezado Authorization }
        expiraEn: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }
    PerfilCambio:
      type: object
      properties:
        telefonoMovil: { type: string }
        identificadorInstitucional: { type: string }
        carreraAdscripcion: { type: string }
        aceptaEntrenamientoIa: { type: boolean }
    ContactoEntrada:
      type: object
      required: [id, nombre, telefono, prioridad]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, minLength: 2, maxLength: 80 }
        telefono: { type: string, description: 10 dígitos }
        prioridad: { type: integer, minimum: 1 }
    Contacto:
      type: object
      required: [id, nombre, telefono, prioridad, canalPreferido, activo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        telefono: { type: string }
        prioridad: { type: integer }
        canalPreferido: { type: string, enum: [PUSH, SMS, WHATSAPP] }
        usuarioVinculadoId: { type: string, format: uuid, description: Si el teléfono es de una cuenta }
        activo: { type: boolean }
    Circulo:
      type: object
      required: [id, nombreGrupo, escuelaId, coordinadorId, estadoCodigo]
      properties:
        id: { type: string, format: uuid }
        nombreGrupo: { type: string }
        escuelaId: { type: integer }
        coordinadorId: { type: string, format: uuid }
        codigoInvitacion: { type: string, example: K7Q-42M, description: Solo para el coordinador }
        estadoCodigo: { type: string, enum: [VIGENTE, VENCIDO] }
        codigoVenceEn: { type: string, format: date-time, description: Solo para el coordinador }
    Miembro:
      type: object
      required: [usuarioId, nombre, estado]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        estado: { type: string, enum: [ACTIVA, RETIRADA, DADA_DE_BAJA] }
    Cancelacion:
      type: object
      required: [metodo, exitoso]
      properties:
        dispositivoId: { type: string, format: uuid }
