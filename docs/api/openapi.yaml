openapi: 3.1.0
info:
  title: Sendero Seguro · API del servidor
  version: 0.1.0-borrador
  description: |
    Contrato de la API central (P14). Responsable: Módulo 4 de backend.

    **Estado:** borrador para revisión del equipo. Cuando se congele pasa a `1.0.0`.

    **Qué contiene:**
    - Las rutas de P5 Dispersión, P13 Auditoría, P14 Plataforma y P16 Pasarelas.
    - Las del Módulo 1 que guardan en la nube: P1 Cuentas, P2 Red de apoyo y P8 Cancelación.
    - Administración de cuentas, corporaciones, unidades y operadores (W-08, W-09) y el catálogo (P3, W-06, W-07).
    - P11 Trayectos y el lado del servidor del Módulo 3: P9 Reportes y moderación, P10 Feed y mapa de calor,
      P12 Ruta segura y mapas offline.
    - `POST /alertas` y `POST /alertas/{id}/ubicaciones` como propuesta de referencia
      (P4 y P6 escriben `alerta` y `ubicacion_alerta`). La dispersión se engancha después
      del registro.
    - Los componentes comunes: errores, paginación y enumerados.

    Cada ruta lleva `x-proceso`.

    **Convenciones:**
    - Prefijo `/api/v1`. JSON en camelCase. Fechas ISO 8601 en UTC (`2026-10-25T05:58:01Z`).
    - Los ids de alertas, reportes, trayectos y contactos son UUID generados en el teléfono.
      Un reenvío con el mismo id no duplica: responde `200` con el recurso existente.
    - Los enumerados se mandan tal como están en la base de datos (`EN_ATENCION`, `PUSH`…).
    - Toda respuesta de error usa el esquema `Error`.
    - Paginación por cursor: `?limite=50&cursor=…`; la respuesta trae `siguienteCursor` o `null`.
    - Tiempo real por WebSocket (`/ws/consola`, `/ws/enlace/{token}`). Sus mensajes están en `README.md`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local con docker-compose
  - url: https://sendero-seguro-bse3efh5ddexczcx.mexicocentral-01.azurewebsites.net/api/v1
    description: Nube (Azure App Service)

tags:
  - name: Cuentas
    description: P1 · registro, inicio de sesión, perfil y baja (Módulo 1)
  - name: Red de apoyo
    description: P2 · contactos de confianza, círculo escolar y avisos de vinculación (Módulo 1)
  - name: Plataforma
    description: P14 · salud y sincronización diferida
  - name: Alertas
    description: P4 registra; P5 canaliza, asigna, acusa y escala
  - name: Enlace
    description: P5 y P16 · enlace público de ubicación en vivo para la red de apoyo
  - name: Pasarelas
    description: P16 · FCM y webhooks del proveedor de SMS
  - name: Auditoría
    description: P13 · historial, timeline, bitácora, estadísticas y exportación
  - name: Archivos
    description: P15 · fotos y audios de los reportes y mapas offline, guardados en la nube
  - name: Administración
    description: W-08 y W-09 · cuentas y perfiles, corporaciones, unidades y operadores; turno del operador
  - name: Catálogo
    description: P3 · catálogo vigente para la app y edición, validación y publicación de versiones
  - name: Trayectos
    description: P11 · caminata segura y check-ins guardados en el servidor
  - name: Reportes
    description: P9 · reportes comunitarios, moderación, identidad protegida y feed
  - name: Mapa de calor
    description: P10 · zonas de riesgo con los reportes publicados
  - name: Ruta segura
    description: P12 · ruta segura, grafo peatonal, paquetes de mapa offline, puntos de interés y zonas

security:
  - jwt: []

paths:
  /salud:
    get:
      tags: [Plataforma]
      summary: Estado del servidor y de sus dependencias
      x-proceso: P14
      security: []
      responses:
        '200':
          description: Todo responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: Alguna dependencia no responde (mismo cuerpo, con el componente caído)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /sync/lote:
    post:
      tags: [Plataforma]
      summary: Recibe la cola offline del teléfono (RF-17, A-05)
      description: |
        El servidor procesa los elementos en este orden, sin importar cómo lleguen:
        `ALERTA` → `ACUSE` → `UBICACION` → `CANCELACION` → `REPORTE` → `TRAYECTO` → `CHECKIN`.

        La plataforma recibe el lote, lo ordena y entrega cada elemento al manejador
        registrado para su tipo. Cada elemento es independiente: si uno falla, los demás siguen.
        El `id` de cada elemento es su UUID, así que reenviar el lote completo es seguro.
        Vence sin procesarse un `ACUSE` con más de 2 horas, un `REPORTE` con más de 6 días y lo demás con
        más de 72 horas. En un `RECHAZADO`, `error.detalle.temporal` dice si el teléfono debe conservarlo y
        reintentar (`true`) o borrarlo (`false`). Los resultados vienen en el orden en que llegaron.
        El `dispositivoId` tiene que ser de la persona del token (si no, 403).
      x-proceso: P14, P11
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteSync' }
      responses:
        '200':
          description: Resultado por elemento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoLoteSync' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '413':
          description: El lote pasa de 200 elementos o de 1 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /malla/relevos:
    post:
      tags: [Alertas]
      summary: Entrega una alerta que llegó por la malla (cualquier cuenta con sesión)
      description: |
        RF-14 y A-01. El teléfono que recibió el paquete por Bluetooth y tiene internet lo entrega con su propia sesión.
        El paquete solo trae ids cortos: el servidor reconoce a la persona por los últimos 8 hex del UUID de su cuenta
        (activa) y la alerta por los primeros 8 hex de su UUID y la hora (±60 s), como con el SMS.
        Si la alerta ya llegó por otro camino responde `200` con ella; si no, la registra con `canalRecepcion = MALLA`
        a nombre de la persona, responde `201` y la despacha. Quien la entregó queda en la bitácora.
        Un paquete con más de 24 horas se rechaza.
      x-proceso: P4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelevoMalla' }
      responses:
        '201':
          description: Alerta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '200':
          description: La alerta ya existía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: No hay una cuenta activa con ese id corto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas:
    post:
      tags: [Alertas]
      summary: Registra una alerta (integrante o coordinador)
      description: |
        Idempotente por `id`. También se reconoce si antes llegó por SMS (mismo id corto y hora ±60 s).
        Sin `tipoIncidenteId`, o con uno que no está en el catálogo, se registra como genérica (RF-6).
        Una hora del teléfono en el futuro se toma como la hora actual. La primera vez responde `201` con el folio que asigna el servidor;
        un reenvío responde `200` con la misma alerta y no consume folio.

        Después de insertar, el servidor llama a la dispersión (P5)
        (canalización, asignación, red de apoyo y enlace) sin que la app espere a que termine.
        Meta: responder en 2 s o menos (RNF3).
      x-proceso: P4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaNueva' }
      responses:
        '201':
          description: Alerta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '200':
          description: Reenvío; la alerta ya existía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaRegistrada' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: El id ya existe pero pertenece a otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Alertas]
      summary: Lista de alertas para la consola (W-02)
      description: |
        Un OPERADOR solo ve las alertas asignadas a su unidad. Un ADMINISTRADOR ve todas.
        Orden: activas primero, luego por `prioridadIa` (o la del catálogo) y por antigüedad.
      x-proceso: P5
      parameters:
        - name: estado
          in: query
          description: Uno o varios estados separados por coma. `ACTIVAS` equivale a ENVIADA, ASIGNADA, ESCALADA, ACUSADA y EN_ATENCION.
          schema: { type: string, example: ACTIVAS }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de alertas
          content:
            application/json:
              schema:
                type: object
                required: [elementos, siguienteCursor]
                properties:
                  elementos:
                    type: array
                    items: { $ref: '#/components/schemas/AlertaResumen' }
                  siguienteCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /alertas/{id}:
    get:
      tags: [Alertas]
      summary: Detalle de una alerta (W-03 en la consola, A-13 en la app)
      description: |
        El emisor ve su propia alerta. El operador de una unidad asignada y el Administrador ven el detalle completo.
        Si la alerta tiene `coaccionDetectada`, el emisor la ve como CANCELADA (la pantalla simula la cancelación);
        la consola ve el estado real.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Alerta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /alertas/{id}/ubicaciones:
    post:
      tags: [Alertas]
      summary: Agrega lecturas de ubicación (propuesta de referencia)
      description: Idempotente por (`capturadaEn`, `fuente`). Cada lectura nueva se reenvía por WebSocket a la consola y al enlace.
      x-proceso: P6
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lecturas]
              properties:
                lecturas:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Ubicacion' }
      responses:
        '200':
          description: Cuántas entraron y cuántas ya existían
          content:
            application/json:
              schema:
                type: object
                required: [insertadas, duplicadas]
                properties:
                  insertadas: { type: integer }
                  duplicadas: { type: integer }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La alerta ya está cerrada o cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas/{id}/acuse:
    post:
      tags: [Alertas]
      summary: El operador acusa la alerta y se detiene el escalamiento (CU-18)
      description: Idempotente. Si ya estaba acusada responde `200` con el acuse original.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Alerta acusada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /alertas/{id}/estado:
    patch:
      tags: [Alertas]
      summary: Cambia el estado de atención (E-01)
      description: |
        Transiciones permitidas desde la consola:
        `ACUSADA → EN_ATENCION → ATENDIDA → CERRADA`.
        Para `CERRADA` son obligatorios `resultadoCierre` y la persona que cierra (sale del token).
        La cancelación por el emisor **no** va aquí: es de P8.
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioEstado' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaDetalle' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /alertas/{id}/escalar:
    post:
      tags: [Alertas]
      summary: Escalamiento manual al siguiente nivel (motivo MANUAL)
      x-proceso: P5
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comentario: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Nuevo escalamiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escalamiento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: No hay más pasos en la cadena de escalamiento, o la alerta ya no está activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alertas/{id}/timeline:
    get:
      tags: [Auditoría]
      summary: Línea de tiempo de una alerta (A-13, W-03)
      description: Une `evento_alerta`, `asignacion`, `escalamiento`, `notificacion` e `intento_cancelacion` en orden cronológico.
      x-proceso: P13
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      responses:
        '200':
          description: Eventos en orden
          content:
            application/json:
              schema:
                type: object
                required: [alertaId, eventos]
                properties:
                  alertaId: { type: string, format: uuid }
                  eventos:
                    type: array
                    items: { $ref: '#/components/schemas/EventoTimeline' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /enlace/{token}:
    get:
      tags: [Enlace]
      summary: Página pública de ubicación en vivo (CU-16)
      description: |
        Sin cuenta. El token viaja en el SMS o push de la red de apoyo; el servidor solo guarda su hash.
        No muestra datos del perfil (X-01). Para recibir actualizaciones se abre `WS /ws/enlace/{token}`.
      x-proceso: P5, P16
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Enlace vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnlacePublico' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '410':
          description: El enlace venció o se revocó porque la alerta se cerró o canceló
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispositivos/{id}/push:
    put:
      tags: [Pasarelas]
      summary: Registra o renueva el token de FCM del dispositivo
      description: Solo el dueño del dispositivo. La app lo llama al iniciar sesión y cada vez que FCM rota el token.
      x-proceso: P16
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken: { type: string, minLength: 20, maxLength: 4096 }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /archivos/{tipo}:
    post:
      tags: [Archivos]
      summary: Sube una foto o audio de un reporte, o un paquete de mapas
      description: |
        El cuerpo es el archivo tal cual (no multipart), con su `Content-Type`. El servidor lo guarda en el almacén
        (Azure Blob Storage en la nube) y responde la clave, el tamaño y el SHA-256. El módulo que lo usa los guarda en
        `evidencia` (`url_objeto`, `mime`, `tamano_bytes`, `hash_sha256`) o en `paquete_mapa` (`ruta_archivo`, …).

        - `evidencia`: cualquier cuenta. `image/jpeg`, `image/png`, `image/webp`, `audio/mpeg`, `audio/mp4`,
          `audio/aac` o `audio/ogg`. Hasta 10 MB.
        - `mapa`: solo el Administrador. `application/zip` o `application/octet-stream`. Hasta 200 MB.
      x-proceso: P15
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [evidencia, mapa] }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoGuardado' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: Pasa del tamaño máximo (`MUY_GRANDE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: El `Content-Type` no está permitido para ese tipo (`TIPO_NO_PERMITIDO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /archivos/{tipo}/{nombre}:
    get:
      tags: [Archivos]
      summary: Descarga un archivo
      description: Cualquier cuenta con sesión. `nombre` es la parte final de la clave (`<uuid>.<extensión>`). El archivo no cambia nunca, así que se puede guardar en caché.
      x-proceso: P15
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [evidencia, mapa] }
        - name: nombre
          in: path
          required: true
          schema: { type: string, example: 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg }
      responses:
        '200':
          description: El archivo, con su `Content-Type`
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /pasarela/sms/entrante:
    post:
      tags: [Pasarelas]
      summary: Webhook de Twilio para SMS recibidos (CU-25)
      description: |
        Lo llama Twilio cuando llega un SMS a su número, no la app. Se valida con `X-Twilio-Signature`.

        Cada mensaje se guarda en `mensaje_sms`, válido o no. Si es un `SS1|…` válido de una cuenta activa,
        se registra la alerta con `canalRecepcion = SMS` y sigue el mismo flujo de dispersión; si la alerta
        ya existía (mismo id corto y hora ±60 s), solo se liga a ella. El formato `SS1` está en `README.md`.
        Siempre responde `200` para que Twilio no reintente un mensaje que ya se guardó: TwiML vacío
        (no se contesta nada al teléfono), o JSON si la petición pide `Accept: application/json`.
      x-proceso: P16, P5
      security:
        - firmaTwilio: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/SmsEntrante' }
      responses:
        '200':
          description: Mensaje guardado
          content:
            text/xml:
              schema: { type: string, example: '<?xml version="1.0" encoding="UTF-8"?><Response></Response>' }
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  mensajeId: { type: [integer, 'null'], format: int64, description: Nulo si el remitente no es un número de teléfono }
                  valido: { type: boolean }
                  alertaId: { type: [string, 'null'], format: uuid, description: Nulo si no es válido o si el registro está pendiente }
        '401':
          description: Firma de Twilio inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pasarela/sms/estado:
    post:
      tags: [Pasarelas]
      summary: Webhook de Twilio con el estado de entrega de un SMS enviado
      description: |
        Twilio lo llama para cada SMS que mandó el servidor (`StatusCallback`). Actualiza `notificacion` (E-03)
        buscando por `proveedor_mensaje_id = MessageSid`:
        `sent` deja de esperar la confirmación, `delivered` pasa a `ENTREGADA`, y `undelivered` o `failed`
        pasa a `FALLIDA` (se reintenta) o a `DESCARTADA` con los errores 30004, 30005 y 30006.
        Los demás estados se ignoran.
      x-proceso: P16
      security:
        - firmaTwilio: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, MessageStatus]
              properties:
                MessageSid: { type: string, maxLength: 120 }
                MessageStatus: { type: string, enum: [queued, sending, sent, delivered, undelivered, failed] }
                ErrorCode: { type: string }
      responses:
        '204': { description: Actualizado (o ignorado si no se encontró) }
        '401':
          description: Firma de Twilio inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pasarela/smsgate:
    post:
      tags: [Pasarelas]
      summary: Webhook del celular Android que funciona como pasarela SMS
      description: |
        Lo llama la app SMS Gateway for Android (docs.sms-gate.app) instalada en el celular pasarela, no la app
        de Sendero Seguro. Es la alternativa gratuita a Twilio: se activa con `AVISOS_PROVEEDOR_SMS=smsgate`.
        Una sola ruta recibe todos los eventos registrados en la app:

        - `sms:received`: un SMS que llegó al chip. Sigue el mismo flujo que `/pasarela/sms/entrante`
          (`mensaje_sms`, `SS1`, registro o liga de la alerta) y responde `200` con el resultado.
        - `sms:sent`: deja de esperar la confirmación. `sms:delivered`: el aviso pasa a `ENTREGADA`.
          `sms:failed`: pasa a `FALLIDA` y se reintenta. Se busca por `proveedor_mensaje_id = payload.messageId`.
        - Cualquier otro evento (`system:ping`...) responde `204` y se ignora.

        La app reintenta mientras no reciba un `2xx`.
      x-proceso: P16, P5
      security:
        - firmaSmsGate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoSmsGate' }
      responses:
        '200':
          description: SMS recibido y guardado (`sms:received`)
          content:
            application/json:
              schema:
                type: object
                required: [valido]
                properties:
                  mensajeId: { type: [integer, 'null'], format: int64 }
                  valido: { type: boolean }
                  alertaId: { type: [string, 'null'], format: uuid }
        '204': { description: 'Estado actualizado, o evento ignorado' }
        '400':
          description: El aviso no trae `event` y `payload`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Firma inválida o `X-Timestamp` con más de 5 minutos de diferencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: En la nube sin `SMSGATE_LLAVE_FIRMA`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /historial:
    get:
      tags: [Auditoría]
      summary: Historial propio (alertas, reportes con nombre y trayectos)
      description: Lee `v_historial_usuario` de la persona del token. Los reportes anónimos no aparecen. Una alerta cancelada con el PIN de coacción sale como `CANCELADA`.
      x-proceso: P13
      parameters:
        - name: tipo
          in: query
          schema: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página del historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaHistorial' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /usuarios/{id}/historial:
    get:
      tags: [Auditoría]
      summary: Historial de otra persona (solo Administrador, con justificación)
      description: La consulta y su justificación quedan en `bitacora` (`CONSULTAR_HISTORIAL_AJENO`). Muestra el estado real de cada alerta.
      x-proceso: P13
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Justificacion
          in: header
          required: true
          schema: { type: string, minLength: 10, maxLength: 500 }
        - name: tipo
          in: query
          schema: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página del historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaHistorial' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /bitacora:
    get:
      tags: [Auditoría]
      summary: Consulta de la bitácora (solo Administrador)
      x-proceso: P13
      parameters:
        - name: accion
          in: query
          schema: { type: string }
        - name: entidad
          in: query
          schema: { type: string }
        - name: entidadId
          in: query
          schema: { type: string }
        - name: usuarioId
          in: query
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de registros
          content:
            application/json:
              schema:
                type: object
                required: [elementos, siguienteCursor]
                properties:
                  elementos:
                    type: array
                    items: { $ref: '#/components/schemas/RegistroBitacora' }
                  siguienteCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /bitacora/verificar:
    get:
      tags: [Auditoría]
      summary: Verifica la cadena de hashes de la bitácora (solo Administrador)
      description: Llama `fn_verificar_bitacora()`. `integra` es verdadero si no hay registros alterados.
      x-proceso: P13
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                type: object
                required: [integra, registrosRevisados, primerIdAlterado, verificadaEn]
                properties:
                  integra: { type: boolean }
                  registrosRevisados: { type: integer, format: int64 }
                  primerIdAlterado: { type: [integer, 'null'], format: int64 }
                  verificadaEn: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /estadisticas/alertas:
    get:
      tags: [Auditoría]
      summary: Indicadores de alertas para el tablero (RF-26, W-08), solo Administrador
      description: |
        Sale de `v_alerta_tiempos`. Sin datos personales. El periodo va por días completos en la hora de la
        Ciudad de México y no puede pasar de 366 días. La zona se toma de la primera ubicación de la alerta.
        `pctCumpleMetaAcuse` cuenta las alertas acusadas y las que pasaron la meta sin acuse.
      x-proceso: P13
      parameters:
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroTipo'
        - $ref: '#/components/parameters/FiltroZona'
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estadisticas' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /estadisticas/exportar:
    get:
      tags: [Auditoría]
      summary: Exporta las estadísticas en CSV (X-02) o PDF tamaño carta (X-03), solo Administrador
      description: |
        Mismos filtros y números que `/estadisticas/alertas`. Cada exportación queda en `bitacora` como
        `EXPORTAR_ESTADISTICAS`. El archivo llega como descarga (`Content-Disposition: attachment`). El CSV
        tiene una fila por dato (`seccion,concepto,valor,mediana_acuse_seg`) en UTF-8 con BOM.
      x-proceso: P13
      parameters:
        - name: formato
          in: query
          required: true
          schema: { type: string, enum: [csv, pdf] }
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroTipo'
        - $ref: '#/components/parameters/FiltroZona'
      responses:
        '200':
          description: Archivo
          content:
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ------------------------------------------------------------------ Módulo 1: P1 Cuentas
  /avisos-privacidad/vigente:
    get:
      tags: [Cuentas]
      summary: Aviso de privacidad vigente (lo acepta la persona al registrarse)
      x-proceso: P1
      security: []
      responses:
        '200':
          description: Aviso vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoPrivacidad' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /instituciones:
    get:
      tags: [Cuentas]
      summary: Instituciones activas, para el registro
      x-proceso: P1
      security: []
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Institucion' } }

  /instituciones/{id}/escuelas:
    get:
      tags: [Cuentas]
      summary: Escuelas activas de una institución
      x-proceso: P1
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Escuela' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /auth/registro:
    post:
      tags: [Cuentas]
      summary: Crea la cuenta, guarda el consentimiento y el teléfono, y abre la sesión (CU-01)
      description: |
        La contraseña se guarda con Argon2id. `tipoComunidad = DOCENTE` crea la cuenta como COORDINADOR; las demás
        como INTEGRANTE. Los errores de validación traen `detalle.errores` con la misma clave de campo que usa la app
        (`nombre`, `telefono`, `identificador`, `escuela`, `carrera`, `contrasena`, `tipoComunidad`,
        `consentimiento`, `dispositivo`).
      x-proceso: P1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registro' }
      responses:
        '201':
          description: Cuenta creada y sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /auth/login:
    post:
      tags: [Cuentas]
      summary: Inicia sesión con teléfono (10 dígitos) o matrícula (CU-02)
      description: |
        Sin `dispositivo` es la consola web; con `dispositivo` es la app. El ADMINISTRADOR no entra por la app
        (`403 PERFIL_NO_PERMITIDO`, con `detalle.rol`); el OPERADOR entra por las dos (modo operador sin señal, A-14). Al 5.º intento fallido (`login_max_intentos`) la cuenta
        queda bloqueada `login_bloqueo_minutos` (15).
      x-proceso: P1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401':
          description: '`CREDENCIALES_INVALIDAS`, con `detalle.intentosRestantes` si la cuenta existe'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: '`CUENTA_SUSPENDIDA` (suspendida o dada de baja) o `PERFIL_NO_PERMITIDO`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '423':
          description: '`CUENTA_BLOQUEADA`, con `detalle.bloqueadaHasta`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/logout:
    post:
      tags: [Cuentas]
      summary: Cierra la sesión del token; desde ese momento el token responde 401
      x-proceso: P1
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /usuarios/me:
    get:
      tags: [Cuentas]
      summary: Perfil de quien tiene la sesión
      x-proceso: P1
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    patch:
      tags: [Cuentas]
      summary: Cambia teléfono, matrícula, carrera o el permiso de entrenamiento de IA (CU-03)
      description: Solo se cambian los campos que llegan.
      x-proceso: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilCambio' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /usuarios/me/baja:
    post:
      tags: [Cuentas]
      summary: Pide la baja de la cuenta (derecho ARCO de cancelación)
      description: Pide la contraseña. La cuenta queda BAJA_SOLICITADA, se cierran todas sus sesiones y se crea la solicitud ARCO.
      x-proceso: P1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena]
              properties:
                contrasena: { type: string }
      responses:
        '204': { description: Baja solicitada }
        '401': { description: Contraseña incorrecta o sin token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------------------ Módulo 1: P2 Red de apoyo
  /contactos:
    get:
      tags: [Red de apoyo]
      summary: Contactos de confianza activos, por prioridad
      x-proceso: P2
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /contactos/{id}:
    put:
      tags: [Red de apoyo]
      summary: Agrega o edita un contacto (idempotente; el id lo genera el teléfono)
      description: |
        Queda CONFIRMADO. Si el teléfono es de una cuenta, el servidor llena `usuarioVinculadoId` y pone
        `canalPreferido = PUSH`. El mismo número dos veces en la lista responde `409 DUPLICADO` (`detalle.errores.telefono`).
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactoEntrada' }
      responses:
        '200':
          description: Contacto guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Duplicado' }
    delete:
      tags: [Red de apoyo]
      summary: Quita un contacto (idempotente; 204 aunque ya no exista)
      description: Si ya recibió algún aviso queda inactivo en lugar de borrarse, para conservar el historial.
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Quitado }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /contactos/orden:
    put:
      tags: [Red de apoyo]
      summary: Reordena los contactos; quedan con prioridad 1..n
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, description: Todos los contactos activos, en el orden nuevo }
      responses:
        '200':
          description: Contactos en el orden nuevo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /circulos/mio:
    get:
      tags: [Red de apoyo]
      summary: El círculo escolar de la persona, o `{}` si no está en ninguno
      x-proceso: P2
      responses:
        '200':
          description: Círculo
          content:
            application/json:
              schema:
                type: object
                properties:
                  circulo: { $ref: '#/components/schemas/Circulo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /circulos:
    post:
      tags: [Red de apoyo]
      summary: Crea un círculo (solo COORDINADOR); el servidor genera el código y su vigencia
      description: |
        Código con formato AAA-999 (sin 0, O, 1, I ni L), válido `codigo_invitacion_dias` (7). El coordinador queda
        como integrante. Un reenvío con el mismo id responde el mismo círculo. Cada persona está en un solo círculo.
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, nombreGrupo]
              properties:
                id: { type: string, format: uuid }
                nombreGrupo: { type: string, minLength: 3, maxLength: 100 }
      responses:
        '201':
          description: Círculo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: Ya pertenece a un círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/unirse:
    post:
      tags: [Red de apoyo]
      summary: Se une a un círculo con su código (acepta minúsculas y sin guion)
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, example: K7Q-42M }
      responses:
        '200':
          description: Círculo al que se unió (sin el código, que solo ve el coordinador)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { description: '`CODIGO_INVALIDO`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Ya pertenece a otro círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: '`CODIGO_VENCIDO`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/{id}/codigo:
    post:
      tags: [Red de apoyo]
      summary: Genera un código nuevo (solo su coordinador); el anterior deja de servir
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Círculo con el código nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Circulo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /circulos/{id}/miembros:
    get:
      tags: [Red de apoyo]
      summary: Integrantes del círculo con su último estado (solo integrantes activos lo ven)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista, primero los activos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /circulos/{id}/miembros/{usuarioId}:
    delete:
      tags: [Red de apoyo]
      summary: Da de baja a un integrante (solo su coordinador; queda DADA_DE_BAJA)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dado de baja (o ya no estaba) }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: El coordinador no puede darse de baja a sí mismo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /circulos/{id}/retirarme:
    post:
      tags: [Red de apoyo]
      summary: Sale del círculo (queda RETIRADA)
      x-proceso: P2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Retirada (o ya no estaba) }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { description: El coordinador no puede retirarse de su círculo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /red-apoyo/avisos:
    post:
      tags: [Red de apoyo]
      summary: Avisa de una vinculación nueva (X-01)
      description: |
        `CONTACTO_AGREGADO` manda un SMS al contacto; `NUEVO_INTEGRANTE` manda un push (o SMS) al coordinador.
        La misma petición en menos de un día no crea otro aviso.
      x-proceso: P2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { type: string, enum: [CONTACTO_AGREGADO, NUEVO_INTEGRANTE] }
                contactoId: { type: string, format: uuid, description: Para CONTACTO_AGREGADO }
                circuloId: { type: string, format: uuid, description: Para NUEVO_INTEGRANTE }
      responses:
        '202': { description: Aviso en cola }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Módulo 1: P8 Cancelación
  /alertas/{id}/cancelaciones:
    post:
      tags: [Alertas]
      summary: Cancela la alerta, o registra un PIN que no coincide como posible coacción (CU-21)
      description: |
        Solo quien envió la alerta. El PIN se verifica en el teléfono.
        - `exitoso: true`: la alerta pasa a CANCELADA y se avisa a la unidad y a la red de apoyo.
        - `exitoso: false`: la alerta **sigue activa**, queda `coaccionDetectada` y la consola lo ve. A quien la envió
          se le muestra como CANCELADA.
        Idempotente: el mismo intento (misma alerta y mismo `intentadoEn`) no se guarda dos veces. Si la alerta ya
        terminó, el intento se guarda y no cambia nada.
      x-proceso: P8
      parameters:
        - $ref: '#/components/parameters/IdAlerta'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cancelacion' }
      responses:
        '204': { description: Registrado }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ---------------------------------------------------------------- Administración (W-08, W-09)

  /usuarios:
    get:
      tags: [Administración]
      summary: Busca cuentas por nombre, matrícula o teléfono (W-09)
      description: Solo Administrador. `buscar` necesita 3 caracteres o más, o bien el filtro `rol`.
      x-proceso: P14
      parameters:
        - { name: buscar, in: query, schema: { type: string, minLength: 3 } }
        - { name: rol, in: query, schema: { type: string, enum: [INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR] } }
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Cuentas encontradas
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UsuarioAdmin' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /usuarios/{id}/perfil:
    patch:
      tags: [Administración]
      summary: Cambia el perfil de una cuenta (CU-07)
      description: |
        Solo Administrador. `motivo` de 10 caracteres o más. OPERADOR necesita `unidadId`. Cierra las sesiones de la
        cuenta y queda en la bitácora (`CAMBIAR_PERFIL`). Sobre la propia cuenta responde `409 PROPIA_CUENTA`.
      x-proceso: P14
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CambioPerfil' } } }
      responses:
        '200': { description: Cuenta actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioAdmin' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: '`PROPIA_CUENTA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /usuarios/{id}/estado:
    patch:
      tags: [Administración]
      summary: Desbloquea (ACTIVA) o suspende (SUSPENDIDA) una cuenta (W-09)
      description: Solo Administrador. Suspender cierra sus sesiones.
      x-proceso: P14
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CambioEstadoCuenta' } } }
      responses:
        '200': { description: Cuenta actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioAdmin' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /corporaciones:
    get:
      tags: [Administración]
      summary: Corporaciones con su número de unidades (W-08)
      description: Administrador u Operador.
      x-proceso: P5
      responses:
        '200':
          description: Corporaciones
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Corporacion' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Administración]
      summary: Da de alta una corporación (CU-10)
      description: |
        Solo Administrador. `tipo`: SEGURIDAD_ESCOLAR, POLICIA, BOMBEROS, ERUM u OTRA. `canalCodigo` en mayúsculas,
        números o guion bajo (2 a 30), único.
      x-proceso: P5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorporacionEntrada' } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Corporacion' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /corporaciones/{id}:
    patch:
      tags: [Administración]
      summary: Edita o desactiva una corporación (CU-10)
      x-proceso: P5
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorporacionCambio' } } }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Corporacion' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /unidades:
    get:
      tags: [Administración]
      summary: Unidades de atención (W-08)
      x-proceso: P5
      parameters:
        - { name: corporacionId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Unidades
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unidad' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Administración]
      summary: Da de alta una unidad (CU-10)
      description: Solo Administrador. `tipos` son códigos activos del catálogo publicado (al menos uno).
      x-proceso: P5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnidadEntrada' } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /unidades/{id}:
    get:
      tags: [Administración]
      summary: Detalle de una unidad con sus operadores
      x-proceso: P5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Unidad, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Administración]
      summary: Edita una unidad o la da de baja (CU-10 2a)
      description: |
        `activa: false` es la baja: la unidad queda FUERA_DE_SERVICIO, sus operadores se desactivan y deja de
        recibir asignaciones. Si está ASIGNADA o ATENDIENDO responde `409 UNIDAD_OCUPADA`.
      x-proceso: P5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnidadCambio' } } }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: '`UNIDAD_OCUPADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /unidades/{id}/operadores:
    put:
      tags: [Administración]
      summary: Reemplaza la lista de operadores de la unidad (CU-10)
      description: Las cuentas de la lista quedan como OPERADOR de esta unidad; las que no vienen se desactivan.
      x-proceso: P5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operadores]
              properties:
                operadores: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: Unidad con sus operadores, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /unidades/mia:
    get:
      tags: [Administración]
      summary: La unidad del operador (A-14)
      description: Solo Operador. 404 si la cuenta no está vinculada a una unidad activa.
      x-proceso: P5
      responses:
        '200': { description: Unidad, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Administración]
      summary: Abre o cierra el turno y manda la ubicación de la unidad
      description: |
        `estado`: DISPONIBLE (abre turno) o FUERA_DE_SERVICIO (cierra). Con una alerta ASIGNADA o ATENDIENDO no se
        puede cambiar el estado (`409 UNIDAD_OCUPADA`), pero sí mandar la ubicación. Queda en la bitácora
        (`CAMBIAR_TURNO_UNIDAD`).
      x-proceso: P5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TurnoCambio' } } }
      responses:
        '200': { description: Unidad, content: { application/json: { schema: { $ref: '#/components/schemas/Unidad' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: '`UNIDAD_OCUPADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------- Catálogo (W-06, W-07, A-08)

  /catalogo:
    get:
      tags: [Catálogo]
      summary: Catálogo vigente para la app
      description: Sin token. Con `?version=N` igual a la vigente responde `304` sin cuerpo.
      x-proceso: P3
      security: []
      parameters:
        - { name: aplicaA, in: query, schema: { type: string, enum: [ALERTA, REPORTE, AMBOS] } }
        - { name: version, in: query, schema: { type: integer } }
      responses:
        '200': { description: Catálogo vigente, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogoVigente' } } } }
        '304': { description: La app ya tiene la versión vigente }

  /catalogo/versiones:
    get:
      tags: [Catálogo]
      summary: Versiones del catálogo
      description: Solo Administrador.
      x-proceso: P3
      responses:
        '200':
          description: Versiones
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VersionCatalogo' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Catálogo]
      summary: Abre un borrador copiando la versión publicada (CU-08)
      description: Solo hay una versión en edición a la vez (`409 EDICION_ABIERTA`).
      x-proceso: P3
      responses:
        '201': { description: Borrador, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: '`EDICION_ABIERTA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /catalogo/versiones/{numero}:
    parameters:
      - { name: numero, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Catálogo]
      summary: Tipos, reglas y problemas de una versión
      x-proceso: P3
      responses:
        '200': { description: Versión, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Catálogo]
      summary: Descarta el borrador
      x-proceso: P3
      responses:
        '204': { description: Descartado }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: '`VERSION_CERRADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /catalogo/versiones/{numero}/tipos/{codigo}:
    put:
      tags: [Catálogo]
      summary: Crea o edita un tipo en el borrador (W-06)
      description: |
        Si el código no existe se crea un tipo nuevo. La genérica no lleva categoría, solo aplica a ALERTA y no se
        desactiva. Un tipo que solo aplica a REPORTE pierde su regla. Editar una versión EN_VALIDACION la regresa a
        BORRADOR; una versión publicada o reemplazada responde `409 VERSION_CERRADA`.
      x-proceso: P3
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
        - { name: codigo, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9_]{3,40}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TipoEntrada' } } }
      responses:
        '200': { description: Versión actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: '`VERSION_CERRADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /catalogo/versiones/{numero}/reglas/{codigo}:
    put:
      tags: [Catálogo]
      summary: Define la regla de canalización y escalamiento de un tipo (W-07, CU-09)
      description: |
        `tiempoMaxAcuseSeg` entre 30 y 600. De 1 a 10 pasos, sin destinos repetidos (la corporación principal
        cuenta). Un paso OPERADOR necesita una cuenta OPERADOR activa.
      x-proceso: P3
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReglaEntrada' } } }
      responses:
        '200': { description: Versión actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: '`VERSION_CERRADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /catalogo/versiones/{numero}/validar:
    post:
      tags: [Catálogo]
      summary: Valida la versión (A-08)
      description: |
        Errores: SIN_GENERICA, SIN_REGLA, SIN_ESCALAMIENTO, CANAL_INACTIVO, ESCALAMIENTO_INACTIVO. Advertencia:
        CANAL_SIN_UNIDADES. Sin errores la versión pasa a EN_VALIDACION; con errores se queda en BORRADOR.
      x-proceso: P3
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Resultado, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /catalogo/versiones/{numero}/publicar:
    post:
      tags: [Catálogo]
      summary: Publica la versión; la anterior queda REEMPLAZADA (CU-08)
      description: Con errores responde `409 CATALOGO_INVALIDO` con la lista en `detalle.errores`.
      x-proceso: P3
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Publicada, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCatalogoDetalle' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: '`CATALOGO_INVALIDO` o `VERSION_CERRADA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------- Trayectos (P11)

  /trayectos:
    post:
      tags: [Trayectos]
      summary: Guarda el inicio de una caminata segura
      description: |
        El `id` lo genera el teléfono; un reenvío responde `200`. Con `compartir: true` se avisa por PUSH a la red de
        apoyo que tiene cuenta (`TRAYECTO_COMPARTIDO`). Sin señal se manda como `TRAYECTO` en `/sync/lote`.
      x-proceso: P11
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrayectoEntrada' } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Trayecto' } } } }
        '200': { description: Ya existía, content: { application/json: { schema: { $ref: '#/components/schemas/Trayecto' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { description: El id ya es de otra persona, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /trayectos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Trayectos]
      summary: Consulta un trayecto
      description: Lo ve su dueño y quien está en su red de apoyo con cuenta.
      x-proceso: P11
      responses:
        '200': { description: Trayecto, content: { application/json: { schema: { $ref: '#/components/schemas/Trayecto' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Trayectos]
      summary: Manda la última ubicación o termina el trayecto
      description: |
        La ubicación solo avanza (una más vieja se ignora). De EN_CURSO pasa a FINALIZADO o CANCELADO; un trayecto
        terminado no cambia (`409 TRANSICION_INVALIDA`).
      x-proceso: P11
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrayectoCambio' } } }
      responses:
        '200': { description: Trayecto, content: { application/json: { schema: { $ref: '#/components/schemas/Trayecto' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /trayectos/{id}/checkins:
    post:
      tags: [Trayectos]
      summary: Guarda un check-in (esperado y, si ya se confirmó, cuándo)
      description: El mismo `esperadoEn` actualiza el check-in. Sin señal se manda como `CHECKIN` con `trayectoId`.
      x-proceso: P11
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckinEntrada' } } }
      responses:
        '200': { description: Trayecto con sus check-ins, content: { application/json: { schema: { $ref: '#/components/schemas/Trayecto' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ---------------------------------------------------------------- Reportes y moderación (P9)

  /reportes:
    post:
      tags: [Reportes]
      summary: Levanta un reporte comunitario (CU-28, A-15)
      description: |
        El tipo tiene que aplicar a REPORTE o AMBOS. Descripción de 10 a 2000 caracteres; `creadoEn` de no más de
        7 días. Evidencias: hasta `reporte_max_evidencias` (3), con la clave, el tamaño y el hash que regresó
        `POST /archivos/evidencia`. Un reporte anónimo guarda al autor cifrado (AES-256-GCM con
        `REPORTES_LLAVE_AUTOR`) y no guarda la IP. Queda PENDIENTE de moderación. Un reenvío responde `200`.
        Sin señal se manda como `REPORTE` en `/sync/lote`.
      x-proceso: P9
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReporteEntrada' } } }
      responses:
        '201': { description: Recibido, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteRecibido' } } } }
        '200': { description: Ya existía, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteRecibido' } } } }
        '400': { $ref: '#/components/responses/Invalido' }

  /reportes/mios:
    get:
      tags: [Reportes]
      summary: Mis reportes con nombre y su estado (los anónimos no salen)
      x-proceso: P9
      responses:
        '200':
          description: Reportes
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportePropio' } } } }

  /moderacion/reportes:
    get:
      tags: [Reportes]
      summary: Cola de moderación (W-05)
      description: Solo Administrador. Por defecto los PENDIENTE, del más viejo al más nuevo.
      x-proceso: P9
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, PUBLICADO, RECHAZADO, RETIRADO] } }
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Reportes
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReporteModeracion' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /moderacion/reportes/{id}:
    get:
      tags: [Reportes]
      summary: Un reporte con su evidencia, su ubicación exacta y la pública
      description: El autor de un anónimo sale como «Anónimo».
      x-proceso: P9
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reporte, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteModeracion' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /reportes/{id}/decision:
    post:
      tags: [Reportes]
      summary: Publica, rechaza o retira un reporte (CU-30)
      description: |
        PUBLICAR o RECHAZAR desde PENDIENTE; RETIRAR desde PUBLICADO. RECHAZAR y RETIRAR piden `motivo`.
        Al publicar, la ubicación pública es el centro de la celda geohash de 7 caracteres (unos 150 m) y, con
        `ocultaDatosPersonales`, se quitan teléfonos y correos de la descripción. `unidoAId` tiene que ser un
        reporte publicado. Al rechazar se avisa al autor (también si es anónimo). Queda en la bitácora
        (`MODERAR_REPORTE`) y el mapa de calor se recalcula.
      x-proceso: P9
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionEntrada' } } }
      responses:
        '200': { description: Reporte, content: { application/json: { schema: { $ref: '#/components/schemas/ReporteModeracion' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/TransicionInvalida' }

  /reportes/{id}/identidad:
    post:
      tags: [Reportes]
      summary: Consulta la identidad protegida del autor de un anónimo (CU-31)
      description: |
        Solo Administrador. `justificacion` de 20 a 1000 caracteres; queda en la bitácora
        (`CONSULTAR_IDENTIDAD_PROTEGIDA`). Un reporte con nombre responde `409 NO_ES_ANONIMO`.
      x-proceso: P9
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [justificacion], properties: { justificacion: { type: string, minLength: 20, maxLength: 1000 } } }
      responses:
        '200': { description: Autor, content: { application/json: { schema: { $ref: '#/components/schemas/IdentidadAutor' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: '`NO_ES_ANONIMO`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /feed:
    get:
      tags: [Reportes]
      summary: Reportes publicados (A-16)
      description: |
        Del más nuevo al más viejo. Con `latitud` y `longitud` filtra por radio (`radioM`, 2000 por defecto) y trae la
        distancia. Nunca trae al autor anónimo ni la ubicación exacta. `siguiente` es el cursor de la página que sigue.
      x-proceso: P10
      parameters:
        - $ref: '#/components/parameters/FiltroTipo'
        - { name: categoria, in: query, schema: { type: string, enum: [FISICO, SOCIAL, DIGITAL] } }
        - { name: dias, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
        - { name: latitud, in: query, schema: { type: number } }
        - { name: longitud, in: query, schema: { type: number } }
        - { name: radioM, in: query, schema: { type: number, minimum: 50, maximum: 50000 } }
        - $ref: '#/components/parameters/FiltroZona'
        - { name: siguiente, in: query, schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Página, content: { application/json: { schema: { $ref: '#/components/schemas/PaginaFeed' } } } }
        '400': { $ref: '#/components/responses/Invalido' }

  # ---------------------------------------------------------------- Mapa de calor (P10, A-06)

  /mapa-calor:
    get:
      tags: [Mapa de calor]
      summary: Capa de zonas de riesgo vigente (A-17)
      description: |
        Zonas de reportes publicados agrupados con DBSCAN (`dbscan_eps_m`, `dbscan_min_puntos`). El nivel sale de la
        suma de los pesos de riesgo del catálogo comparada con `riesgo_umbral_medio` y `riesgo_umbral_alto`. Con
        `?version=N` igual a la vigente responde `304`. Sin ninguna capa generada responde `404 SIN_CAPA`.
      x-proceso: P10
      parameters:
        - { name: periodo, in: query, schema: { type: integer, enum: [7, 30], default: 30 } }
        - $ref: '#/components/parameters/FiltroTipo'
        - { name: version, in: query, schema: { type: integer } }
      responses:
        '200': { description: Capa, content: { application/json: { schema: { $ref: '#/components/schemas/CapaRiesgo' } } } }
        '304': { description: La app ya tiene la capa vigente }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /mapa-calor/zonas/{id}:
    get:
      tags: [Mapa de calor]
      summary: Detalle de una zona con sus motivos
      x-proceso: P10
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Zona, content: { application/json: { schema: { $ref: '#/components/schemas/ZonaDetalle' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /mapa-calor/generar:
    post:
      tags: [Mapa de calor]
      summary: Genera una capa nueva en ese momento
      description: |
        Solo Administrador. El servidor también la genera cada `MAPA_CALOR_REVISION_HORAS` (6) y unos segundos
        después de cada publicación o retiro. Recalcula el riesgo de los tramos del grafo.
      x-proceso: P10
      responses:
        '200': { description: Capa generada, content: { application/json: { schema: { $ref: '#/components/schemas/GeneracionCapa' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ---------------------------------------------------------------- Ruta segura y mapas offline (P12)

  /rutas/segura:
    post:
      tags: [Ruta segura]
      summary: Calcula la ruta más corta y la ruta segura (A-07)
      description: |
        A* sobre el grafo peatonal. Peso de la ruta segura = largo × (1 + α·riesgo), con α = `riesgo_alfa`. El
        origen y el destino tienen que estar a menos de 400 m de un nodo (`422 FUERA_DE_AREA`); sin camino responde
        `422 SIN_RUTA`. Hasta 20 km.
      x-proceso: P12
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SolicitudRuta' } } }
      responses:
        '200': { description: Rutas, content: { application/json: { schema: { $ref: '#/components/schemas/RutasSugeridas' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '422': { description: '`FUERA_DE_AREA` o `SIN_RUTA`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /grafo:
    get:
      tags: [Ruta segura]
      summary: Grafo de una caja para calcular rutas sin señal (CU-36)
      description: Cada lado de la caja menor a 0.2°. Cada tramo trae su riesgo en la capa vigente.
      x-proceso: P12
      parameters:
        - { name: minLatitud, in: query, required: true, schema: { type: number } }
        - { name: minLongitud, in: query, required: true, schema: { type: number } }
        - { name: maxLatitud, in: query, required: true, schema: { type: number } }
        - { name: maxLongitud, in: query, required: true, schema: { type: number } }
      responses:
        '200': { description: Grafo, content: { application/json: { schema: { $ref: '#/components/schemas/Grafo' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
    post:
      tags: [Ruta segura]
      summary: Carga o actualiza nodos y tramos del grafo peatonal
      description: |
        Solo Administrador. Datos de OpenStreetMap ya recortados a la zona; se carga por partes. Si un nodo o tramo
        ya existe se actualiza. Recalcula el riesgo de los tramos. Queda en la bitácora (`CARGAR_GRAFO_PEATONAL`).
      x-proceso: P12
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GrafoEntrada' } } }
      responses:
        '200': { description: Cargado, content: { application/json: { schema: { $ref: '#/components/schemas/GrafoCargado' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /mapas/version:
    get:
      tags: [Ruta segura]
      summary: Versiones vigentes de la capa, el catálogo y los paquetes (CU-36 1a)
      description: La app las compara con su caché para saber qué descargar.
      x-proceso: P12
      responses:
        '200': { description: Versiones, content: { application/json: { schema: { $ref: '#/components/schemas/VersionesMapas' } } } }

  /mapas/paquetes:
    get:
      tags: [Ruta segura]
      summary: Paquetes de mapa offline vigentes
      x-proceso: P12
      responses:
        '200':
          description: Paquetes
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaqueteMapa' } } } }
    post:
      tags: [Ruta segura]
      summary: Publica un paquete de mapa; la versión anterior de la región deja de ser vigente
      description: Solo Administrador. Primero se sube el archivo con `POST /archivos/mapa`.
      x-proceso: P12
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PaqueteEntrada' } } }
      responses:
        '201': { description: Publicado, content: { application/json: { schema: { $ref: '#/components/schemas/PaqueteMapa' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Duplicado' }

  /puntos-interes:
    get:
      tags: [Ruta segura]
      summary: Puntos de interés (casetas, botones de emergencia, luminarias)
      description: Con la caja completa filtra; sin caja trae todos.
      x-proceso: P12
      parameters:
        - { name: minLatitud, in: query, schema: { type: number } }
        - { name: minLongitud, in: query, schema: { type: number } }
        - { name: maxLatitud, in: query, schema: { type: number } }
        - { name: maxLongitud, in: query, schema: { type: number } }
      responses:
        '200':
          description: Puntos
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PuntoInteres' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
    post:
      tags: [Ruta segura]
      summary: Da de alta un punto de interés
      description: Solo Administrador.
      x-proceso: P12
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PuntoInteresEntrada' } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/PuntoInteres' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /zonas:
    get:
      tags: [Ruta segura]
      summary: Zonas geográficas (para filtros del feed y las estadísticas)
      x-proceso: P12
      responses:
        '200':
          description: Zonas
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ZonaGeografica' } } } }
    post:
      tags: [Ruta segura]
      summary: Da de alta una zona geográfica
      description: Solo Administrador.
      x-proceso: P12
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ZonaGeograficaEntrada' } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/ZonaGeografica' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Duplicado' }

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso firmado por el servidor; lo entregan `POST /auth/registro` y `POST /auth/login`.
        Reclamos: `sub` (usuario.id), `rol` (INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR),
        `disp` (dispositivo.id, solo en la app), `sid` (sesion.id), `exp`.
        Dura `JWT_SESION_DIAS` (30 días). `POST /auth/logout` lo invalida en ese momento.
    firmaTwilio:
      type: apiKey
      in: header
      name: X-Twilio-Signature
      description: |
        Base64 de HMAC-SHA1 con el Auth Token de Twilio sobre la URL pública del webhook seguida de cada
        campo del formulario (nombre y valor, ordenados por nombre).

    firmaSmsGate:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256 en hexadecimal, con la llave de firma de la app (`SMSGATE_LLAVE_FIRMA`), del cuerpo tal como
        llega seguido del encabezado `X-Timestamp` (segundos Unix, ±5 minutos de la hora del servidor).

  parameters:
    IdAlerta:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      description: Token aleatorio de 32 bytes en base64url (43 caracteres)
      schema: { type: string, minLength: 43, maxLength: 43 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    FiltroDesde:
      name: desde
      in: query
      required: true
      schema: { type: string, format: date }
    FiltroHasta:
      name: hasta
      in: query
      required: true
      schema: { type: string, format: date }
    FiltroTipo:
      name: tipoIncidenteId
      in: query
      schema: { type: integer }
    FiltroZona:
      name: zonaId
      in: query
      description: zona_geografica.id
      schema: { type: integer }

  responses:
    Invalido:
      description: El cuerpo o los parámetros no son válidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: VALIDACION
            mensaje: La latitud debe estar entre -90 y 90
            detalle: { campo: ubicacion.latitud }
    NoAutenticado:
      description: Falta el token o venció
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El rol del token no puede hacer esto
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: No existe (o no es visible para quien pregunta)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Duplicado:
      description: El dato ya está registrado (`DUPLICADO`); `detalle.errores` dice qué campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: DUPLICADO
            mensaje: Ese dato ya está registrado en otra cuenta
            detalle: { errores: { telefono: Ese dato ya está registrado en otra cuenta } }
    TransicionInvalida:
      description: El cambio de estado no está permitido desde el estado actual (E-01)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: No se puede pasar de ENVIADA a ATENDIDA
            detalle: { estadoActual: ENVIADA, estadoPedido: ATENDIDA }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código estable en mayúsculas, para que la app decida qué hacer
          enum: [VALIDACION, NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, DUPLICADO,
                 TRANSICION_INVALIDA, VENCIDO, DEMASIADAS_PETICIONES, ERROR_INTERNO,
                 CREDENCIALES_INVALIDAS, CUENTA_BLOQUEADA, CUENTA_SUSPENDIDA, PERFIL_NO_PERMITIDO,
                 CODIGO_INVALIDO, CODIGO_VENCIDO]
        mensaje: { type: string, description: Texto para mostrar o registrar }
        detalle: { type: object, additionalProperties: true }

    Salud:
      type: object
      required: [estado, version, componentes]
      properties:
        estado: { type: string, enum: [OK, DEGRADADO, CAIDO] }
        version: { type: string, example: 0.1.0 }
        componentes:
          type: object
          properties:
            baseDatos: { type: string, enum: [OK, CAIDO] }
            redis: { type: string, enum: [OK, CAIDO] }
            almacenObjetos: { type: string, enum: [OK, CAIDO] }

    # ---- Enumerados (copiados de la base de datos) ----
    AlertaEstado:
      type: string
      enum: [CREADA, EN_CUENTA_REGRESIVA, PENDIENTE_ENVIO, EXPIRADA, ENVIADA, ASIGNADA,
             ESCALADA, ACUSADA, EN_ATENCION, ATENDIDA, CERRADA, CANCELADA]
    CanalRecepcion:
      type: string
      enum: [INTERNET, MALLA, SMS]
    Detonador:
      type: string
      enum: [BOTON, ATAJO_FISICO, WIDGET, VOZ, CAIDA, TEMPORIZADOR]
    FuenteUbicacion:
      type: string
      enum: [GNSS, WIFI, CELULAR, ULTIMA_CONOCIDA]
    AsignacionRol:
      type: string
      enum: [PRINCIPAL, INFORMATIVA]
    DestinoEscalamiento:
      type: string
      enum: [OPERADOR, CORPORACION, COORDINADOR_CIRCULO]
    NotificacionCanal:
      type: string
      enum: [PUSH, SMS, WHATSAPP]
    NotificacionEstado:
      type: string
      enum: [PENDIENTE, ENVIADA, ENTREGADA, FALLIDA, DESCARTADA]

    Ubicacion:
      type: object
      required: [latitud, longitud, fuente, capturadaEn]
      properties:
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        precisionM: { type: number, minimum: 0 }
        velocidadMs: { type: number, minimum: 0 }
        rumboGrados: { type: integer, minimum: 0, maximum: 359 }
        bateria: { type: integer, minimum: 0, maximum: 100 }
        fuente: { $ref: '#/components/schemas/FuenteUbicacion' }
        capturadaEn: { type: string, format: date-time }

    AlertaNueva:
      type: object
      required: [id, activadaEn, ubicacion]
      properties:
        id: { type: string, format: uuid, description: UUID generado en el teléfono }
        tipoIncidenteId: { type: integer, description: Sin él (o si no existe) se registra como genérica (RF-6) }
        versionCatalogoId: { type: integer, description: Versión del catálogo que tenía el teléfono; sin ella se usa la publicada }
        tipoSugeridoId: { type: integer, description: Sugerencia de IA-1; va junto con confianzaSugerencia }
        confianzaSugerencia: { type: number, minimum: 0, maximum: 1 }
        descripcion: { type: string, maxLength: 2000 }
        canalRecepcion: { allOf: [{ $ref: '#/components/schemas/CanalRecepcion' }], description: Sin él, INTERNET }
        saltosMalla: { type: integer, minimum: 0, description: Solo si llegó por malla }
        firmaPaquete: { type: string, description: Solo si llegó por malla; se acepta y no se guarda }
        detonador: { allOf: [{ $ref: '#/components/schemas/Detonador' }], description: Sin él, BOTON }
        nivelBateria: { type: integer, minimum: 0, maximum: 100 }
        trayectoId: { type: string, format: uuid, description: Trayecto cuyo temporizador la activó; si va, debe ser de la persona }
        activadaEn: { type: string, format: date-time, description: Reloj del teléfono }
        enviadaEn: { type: string, format: date-time }
        ubicacion: { allOf: [{ $ref: '#/components/schemas/Ubicacion' }], description: 'Aquí fuente y capturadaEn son opcionales: sin ellas, GNSS y activadaEn' }

    RelevoMalla:
      type: object
      required: [idCortoAlerta, idCortoUsuario, latitud, longitud, activadaEn]
      properties:
        idCortoAlerta: { type: string, pattern: '^[0-9a-f]{8}$', description: Primeros 8 hex del UUID de la alerta }
        idCortoUsuario: { type: string, pattern: '^[0-9a-f]{8}$', description: Últimos 8 hex del UUID de la cuenta, sin guiones }
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        nivelBateria: { type: integer, minimum: 0, maximum: 100 }
        ttl: { type: integer }
        saltosMalla: { type: integer, minimum: 0 }
        activadaEn: { type: string, format: date-time, description: Hora de activación que trae el paquete }

    AlertaRegistrada:
      type: object
      required: [id, folio, estado, registradaEn]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: ALR-2026-000001 }
        estado: { $ref: '#/components/schemas/AlertaEstado' }
        registradaEn: { type: string, format: date-time }
        enlaceSeguimiento:
          type: [string, 'null']
          description: URL pública para compartir; null mientras la dispersión aún no la genera
          example: https://sendero-seguro.example/e/3q2-…

    AlertaResumen:
      type: object
      required: [id, folio, estado, tipoIncidente, canalRecepcion, activadaEn, nivelEscalamiento]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        estado: { $ref: '#/components/schemas/AlertaEstado' }
        tipoIncidente: { $ref: '#/components/schemas/TipoIncidenteRef' }
        prioridad:
          type: integer
          description: prioridadIa (0–100) si IA-4 respondió; si no, se deriva de la prioridad del catálogo
        canalRecepcion: { $ref: '#/components/schemas/CanalRecepcion' }
        activadaEn: { type: string, format: date-time }
        acuseLimiteEn: { type: [string, 'null'], format: date-time }
        nivelEscalamiento: { type: integer }
        sinAcuse: { type: boolean }
        ultimaUbicacion:
          oneOf:
            - $ref: '#/components/schemas/Ubicacion'
            - type: 'null'

    AlertaDetalle:
      allOf:
        - $ref: '#/components/schemas/AlertaResumen'
        - type: object
          properties:
            emisor:
              type: object
              description: Solo para la consola. La app del emisor no recibe este bloque.
              properties:
                nombre: { type: string }
                telefonoMovil: { type: string }
                identificadorInstitucional: { type: string }
                escuela: { type: string }
            descripcion: { type: [string, 'null'] }
            detonador: { $ref: '#/components/schemas/Detonador' }
            nivelBateria: { type: [integer, 'null'] }
            coaccionDetectada: { type: boolean, description: Solo para la consola }
            prioridadMotivos: { type: array, items: { type: string } }
            asignaciones:
              type: array
              items: { $ref: '#/components/schemas/Asignacion' }
            registradaEn: { type: string, format: date-time }
            acusadaEn: { type: [string, 'null'], format: date-time }
            cerradaEn: { type: [string, 'null'], format: date-time }
            resultadoCierre: { type: [string, 'null'] }
            canceladaEn: { type: [string, 'null'], format: date-time }

    TipoIncidenteRef:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        categoria: { type: [string, 'null'], enum: [FISICO, SOCIAL, DIGITAL, null] }
        esGenerica: { type: boolean }

    Asignacion:
      type: object
      required: [unidadId, unidadNombre, corporacion, rol, nivelEscalamiento, asignadaEn]
      properties:
        unidadId: { type: string, format: uuid }
        unidadNombre: { type: string }
        corporacion: { type: string }
        rol: { $ref: '#/components/schemas/AsignacionRol' }
        nivelEscalamiento: { type: integer }
        distanciaM: { type: [number, 'null'] }
        asignadaEn: { type: string, format: date-time }
        liberadaEn: { type: [string, 'null'], format: date-time }

    Escalamiento:
      type: object
      required: [nivel, destinoTipo, motivo, escaladaEn]
      properties:
        nivel: { type: integer, minimum: 1 }
        destinoTipo: { $ref: '#/components/schemas/DestinoEscalamiento' }
        corporacion: { type: [string, 'null'] }
        operadorId: { type: [string, 'null'], format: uuid }
        motivo: { type: string, enum: [SIN_ACUSE, MANUAL] }
        escaladaEn: { type: string, format: date-time }

    CambioEstado:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [EN_ATENCION, ATENDIDA, CERRADA] }
        resultadoCierre: { type: string, maxLength: 500, description: Obligatorio si estado = CERRADA }
        observaciones: { type: string, maxLength: 2000 }

    EventoTimeline:
      type: object
      required: [tipo, ocurridoEn]
      properties:
        tipo:
          type: string
          enum: [CAMBIO_ESTADO, ASIGNACION, ESCALAMIENTO, NOTIFICACION, INTENTO_CANCELACION]
        ocurridoEn: { type: string, format: date-time }
        actor: { type: [string, 'null'], description: Nombre o rol de quien lo hizo; null si fue el sistema }
        estadoAnterior: { $ref: '#/components/schemas/AlertaEstado' }
        estadoNuevo: { $ref: '#/components/schemas/AlertaEstado' }
        detalle: { type: object, additionalProperties: true }

    EnlacePublico:
      type: object
      required: [tipo, venceEn, activa]
      properties:
        tipo: { type: string, enum: [ALERTA, TRAYECTO] }
        primerNombre: { type: string, description: Solo el primer nombre del emisor, para que el contacto sepa de quién es }
        estado: { type: string, description: Estado legible (Enviada, En atención…), sin detalles internos }
        venceEn: { type: string, format: date-time }
        activa: { type: boolean }
        ultimaUbicacion:
          oneOf:
            - $ref: '#/components/schemas/Ubicacion'
            - type: 'null'
        websocket: { type: string, example: wss://api.sendero-seguro.example/api/v1/ws/enlace/… }

    SmsEntrante:
      type: object
      description: Campos que manda Twilio (manda más, y se ignoran).
      required: [From, Body]
      properties:
        From: { type: string, description: 'Número de origen en formato internacional, por ejemplo +525512345678' }
        Body: { type: string, description: Texto del SMS; se guardan hasta 160 caracteres }
        MessageSid: { type: string }

    AvisoSmsGate:
      type: object
      description: Aviso de la app SMS Gateway for Android (manda más campos, y se ignoran).
      required: [event, payload]
      properties:
        event: { type: string, example: 'sms:received' }
        deviceId: { type: string }
        id: { type: string }
        webhookId: { type: string }
        payload:
          type: object
          properties:
            messageId: { type: string, description: 'Id del mensaje; en los de estado, el que mandó el servidor' }
            message: { type: string, description: Texto del SMS (`sms:received`) }
            sender: { type: string, description: Número de origen (`sms:received`) }
            reason: { type: string, description: Motivo de la falla (`sms:failed`) }

    LoteSync:
      type: object
      required: [dispositivoId, elementos]
      properties:
        dispositivoId: { type: string, format: uuid }
        elementos:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ElementoSync' }

    ElementoSync:
      type: object
      required: [tipo, id, creadoEn, datos]
      properties:
        tipo: { type: string, enum: [ALERTA, ACUSE, UBICACION, CANCELACION, REPORTE, TRAYECTO, CHECKIN] }
        id: { type: string, format: uuid, description: Id de cola_sincronizacion en el teléfono }
        creadoEn: { type: string, format: date-time }
        datos:
          type: object
          description: |
            El mismo cuerpo que la ruta normal de ese tipo:
            - ALERTA: `AlertaNueva`.
            - UBICACION: `{ alertaId, lecturas[] }`.
            - ACUSE (solo un OPERADOR con unidad activa, A-14): `{ idCortoAlerta, idCortoUsuario, activadaEn, acusadaEn,
              alertaId? }`. `idCortoAlerta` son los primeros 8 hex del id de la alerta e `idCortoUsuario` los últimos 8
              hex del id de la persona. Si la unidad está asignada es el acuse normal; si la alerta no tiene acuse y la
              unidad está libre, la unidad toma la alerta; si no, queda como apoyo. `acusadaEn` se ajusta entre la
              activación y la hora del servidor.
            - CANCELACION: `Cancelacion` más `alertaId` (el id que el teléfono le dio a la alerta).
            - REPORTE: `ReporteEntrada`.
            - TRAYECTO: `TrayectoEntrada` (puede llegar ya terminado, con `estado` y `finalizadoEn`).
            - CHECKIN: `CheckinEntrada` más `trayectoId`.
            Si la alerta o el trayecto todavía no llegan, el elemento se rechaza con `temporal: true`.
          additionalProperties: true

    ResultadoLoteSync:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          items:
            type: object
            required: [id, resultado]
            properties:
              id: { type: string, format: uuid }
              resultado:
                type: string
                enum: [ACEPTADO, DUPLICADO, RECHAZADO, VENCIDO]
                description: El teléfono borra de su cola todo lo que no sea RECHAZADO con error temporal
              error: { $ref: '#/components/schemas/Error' }
              referencia: { type: string, description: 'Folio asignado, por ejemplo ALR-2026-000001' }

    ElementoHistorial:
      type: object
      required: [tipo, id, estado, ocurridoEn]
      properties:
        tipo: { type: string, enum: [ALERTA, REPORTE, TRAYECTO] }
        id: { type: string, format: uuid }
        referencia: { type: [string, 'null'], description: Folio; null en trayectos }
        estado: { type: string }
        ocurridoEn: { type: string, format: date-time }

    PaginaHistorial:
      type: object
      required: [elementos, siguienteCursor]
      properties:
        elementos:
          type: array
          items: { $ref: '#/components/schemas/ElementoHistorial' }
        siguienteCursor: { type: [string, 'null'] }

    RegistroBitacora:
      type: object
      required: [id, ocurridaEn, accion, hash]
      properties:
        id: { type: integer, format: int64 }
        ocurridaEn: { type: string, format: date-time }
        usuarioId: { type: [string, 'null'], format: uuid }
        accion: { type: string, example: EXPORTAR_ESTADISTICAS }
        entidad: { type: [string, 'null'] }
        entidadId: { type: [string, 'null'] }
        detalle: { type: object, additionalProperties: true }
        ip: { type: [string, 'null'] }
        hash: { type: string, description: SHA-256 en hexadecimal }

    Estadisticas:
      type: object
      required: [periodo, totalAlertas, porEstado, porTipo, porSemana]
      properties:
        periodo:
          type: object
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
        totalAlertas: { type: integer }
        medianaAcuseSeg: { type: [integer, 'null'] }
        pctCumpleMetaAcuse: { type: [number, 'null'], description: Porcentaje que acusó dentro de meta_acuse_seg (120 s) }
        pctEscaladas: { type: number }
        pctCanceladas: { type: number }
        porCanal:
          type: object
          additionalProperties: { type: integer }
          example: { INTERNET: 120, MALLA: 8, SMS: 3 }
        porEstado:
          type: object
          additionalProperties: { type: integer }
        porTipo:
          type: array
          items:
            type: object
            properties:
              tipoIncidenteId: { type: integer }
              nombre: { type: string }
              total: { type: integer }
              medianaAcuseSeg: { type: [integer, 'null'] }
        porSemana:
          type: array
          items:
            type: object
            properties:
              semana: { type: string, example: 2026-W43 }
              total: { type: integer }

    ArchivoGuardado:
      type: object
      required: [clave, url, mime, tamanoBytes, hashSha256]
      properties:
        clave: { type: string, example: evidencia/3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg, description: Va en `evidencia.url_objeto` o `paquete_mapa.ruta_archivo` }
        url: { type: string, example: /archivos/evidencia/3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90.jpg, description: Ruta de descarga, relativa a /api/v1 }
        mime: { type: string, example: image/jpeg }
        tamanoBytes: { type: integer, example: 482113 }
        hashSha256: { type: string, example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }

    # ---------------------------------------------------------------- Módulo 1 (P1, P2, P8)
    AvisoPrivacidad:
      type: object
      required: [id, version, contenidoHash]
      properties:
        id: { type: integer }
        version: { type: string }
        contenidoHash: { type: string, description: SHA-256 del texto del aviso }
    Institucion:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer }
        nombre: { type: string }
        siglas: { type: string }
    Escuela:
      type: object
      required: [id, institucionId, nombre]
      properties:
        id: { type: integer }
        institucionId: { type: integer }
        nombre: { type: string }
    Dispositivo:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, description: Lo genera la app y no cambia entre sesiones }
        modelo: { type: string }
        androidApi: { type: integer, minimum: 26 }
        soportaWifiAware: { type: boolean, default: false }
    Registro:
      type: object
      required: [nombre, telefonoMovil, identificadorInstitucional, tipoComunidad, escuelaId, contrasena, consentimiento, dispositivo]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120, description: Solo letras y espacios }
        telefonoMovil: { type: string, example: '5512345678', description: 10 dígitos; acepta espacios, guiones y +52 }
        identificadorInstitucional: { type: string, pattern: '^[A-Za-z0-9]{6,15}$', description: Matrícula o número de empleado }
        tipoComunidad: { type: string, enum: [ALUMNO, DOCENTE, PERSONAL] }
        escuelaId: { type: integer }
        carreraAdscripcion: { type: string, minLength: 3, maxLength: 120 }
        contrasena: { type: string, minLength: 8, maxLength: 128, description: Al menos una letra y un número }
        aceptaEntrenamientoIa: { type: boolean, default: false }
        consentimiento:
          type: object
          required: [avisoId]
          properties:
            avisoId: { type: integer }
            aceptadoEn: { type: string, format: date-time }
        dispositivo: { $ref: '#/components/schemas/Dispositivo' }
    Login:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario: { type: string, description: Teléfono (10 dígitos) o matrícula }
        contrasena: { type: string }
        dispositivo: { $ref: '#/components/schemas/Dispositivo' }
    Usuario:
      type: object
      required: [id, nombre, telefonoMovil, identificadorInstitucional, escuelaId, rol, estado, aceptaEntrenamientoIa]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        telefonoMovil: { type: string }
        identificadorInstitucional: { type: string }
        escuelaId: { type: integer }
        carreraAdscripcion: { type: string }
        rol: { type: string, enum: [INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR] }
        estado: { type: string, enum: [ACTIVA, BLOQUEADA_TEMPORAL, SUSPENDIDA, BAJA_SOLICITADA, ELIMINADA] }
        aceptaEntrenamientoIa: { type: boolean }
    Sesion:
      type: object
      required: [token, expiraEn, usuario]
      properties:
        token: { type: string, description: JWT para el encabezado Authorization }
        expiraEn: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }
    PerfilCambio:
      type: object
      properties:
        telefonoMovil: { type: string }
        identificadorInstitucional: { type: string }
        carreraAdscripcion: { type: string }
        aceptaEntrenamientoIa: { type: boolean }
    ContactoEntrada:
      type: object
      required: [id, nombre, telefono, prioridad]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, minLength: 2, maxLength: 80 }
        telefono: { type: string, description: 10 dígitos }
        prioridad: { type: integer, minimum: 1 }
    Contacto:
      type: object
      required: [id, nombre, telefono, prioridad, canalPreferido, activo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        telefono: { type: string }
        prioridad: { type: integer }
        canalPreferido: { type: string, enum: [PUSH, SMS, WHATSAPP] }
        usuarioVinculadoId: { type: string, format: uuid, description: Si el teléfono es de una cuenta }
        activo: { type: boolean }
    Circulo:
      type: object
      required: [id, nombreGrupo, escuelaId, coordinadorId, estadoCodigo]
      properties:
        id: { type: string, format: uuid }
        nombreGrupo: { type: string }
        escuelaId: { type: integer }
        coordinadorId: { type: string, format: uuid }
        codigoInvitacion: { type: string, example: K7Q-42M, description: Solo para el coordinador }
        estadoCodigo: { type: string, enum: [VIGENTE, VENCIDO] }
        codigoVenceEn: { type: string, format: date-time, description: Solo para el coordinador }
    Miembro:
      type: object
      required: [usuarioId, nombre, estado]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        estado: { type: string, enum: [ACTIVA, RETIRADA, DADA_DE_BAJA] }
    Cancelacion:
      type: object
      required: [metodo, exitoso]
      properties:
        dispositivoId: { type: string, format: uuid }
        motivo: { type: string, enum: [YA_ESTOY_A_SALVO, FALSA_ALARMA, ACTIVACION_ACCIDENTAL] }
        metodo: { type: string, enum: [PIN, BIOMETRIA] }
        exitoso: { type: boolean, description: false = el PIN no coincidió (posible coacción) }
        intentadoEn: { type: string, format: date-time, description: Hora del teléfono; si falta o es del futuro, la del servidor }

    # ---------------------------------------------------------------- Administración

    UsuarioAdmin:
      type: object
      required: [id, nombre, identificador, telefono, escuela, rol, estado]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        identificador: { type: string, description: Matrícula o número de empleado }
        telefono: { type: string }
        escuela: { type: string }
        rol: { type: string, enum: [INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR] }
        estado: { type: string, enum: [ACTIVA, BLOQUEADA_TEMPORAL, SUSPENDIDA, BAJA_SOLICITADA, ELIMINADA] }
        unidadId: { type: string, format: uuid }
        unidad: { type: string }

    CambioPerfil:
      type: object
      required: [rol, motivo]
      properties:
        rol: { type: string, enum: [INTEGRANTE, COORDINADOR, OPERADOR, ADMINISTRADOR] }
        unidadId: { type: string, format: uuid, description: Obligatoria si el rol es OPERADOR }
        motivo: { type: string, minLength: 10, description: Se guardan hasta 500 caracteres }

    CambioEstadoCuenta:
      type: object
      required: [estado, motivo]
      properties:
        estado: { type: string, enum: [ACTIVA, SUSPENDIDA] }
        motivo: { type: string, minLength: 10, description: Se guardan hasta 500 caracteres }

    Corporacion:
      type: object
      required: [id, nombre, tipo, canalCodigo, activa, unidades]
      properties:
        id: { type: integer }
        nombre: { type: string }
        tipo: { type: string, enum: [SEGURIDAD_ESCOLAR, POLICIA, BOMBEROS, ERUM, OTRA] }
        canalCodigo: { type: string }
        activa: { type: boolean }
        unidades: { type: integer }

    CorporacionEntrada:
      type: object
      required: [nombre, tipo, canalCodigo]
      properties:
        nombre: { type: string }
        tipo: { type: string, enum: [SEGURIDAD_ESCOLAR, POLICIA, BOMBEROS, ERUM, OTRA] }
        canalCodigo: { type: string, pattern: '^[A-Z0-9_]{2,30}$' }

    CorporacionCambio:
      type: object
      properties:
        nombre: { type: string }
        tipo: { type: string, enum: [SEGURIDAD_ESCOLAR, POLICIA, BOMBEROS, ERUM, OTRA] }
        activa: { type: boolean }

    Unidad:
      type: object
      required: [id, corporacionId, corporacion, nombre, estado, activa, tipos, operadores]
      properties:
        id: { type: string, format: uuid }
        corporacionId: { type: integer }
        corporacion: { type: string }
        nombre: { type: string }
        estado: { type: string, enum: [DISPONIBLE, ASIGNADA, ATENDIENDO, FUERA_DE_SERVICIO] }
        activa: { type: boolean }
        tipos: { type: array, items: { type: string }, description: Códigos del catálogo que atiende }
        latitud: { type: number }
        longitud: { type: number }
        ubicacionEn: { type: string, format: date-time }
        operadores:
          type: array
          items:
            type: object
            required: [usuarioId, nombre, activo]
            properties:
              usuarioId: { type: string, format: uuid }
              nombre: { type: string }
              activo: { type: boolean }

    UnidadEntrada:
      type: object
      required: [corporacionId, nombre, tipos]
      properties:
        corporacionId: { type: integer }
        nombre: { type: string }
        tipos: { type: array, minItems: 1, items: { type: string } }

    UnidadCambio:
      type: object
      properties:
        nombre: { type: string }
        tipos: { type: array, minItems: 1, items: { type: string } }
        activa: { type: boolean, description: false = baja de la unidad }

    TurnoCambio:
      type: object
      properties:
        estado: { type: string, enum: [DISPONIBLE, FUERA_DE_SERVICIO] }
        latitud: { type: number }
        longitud: { type: number }

    # ---------------------------------------------------------------- Catálogo

    TipoCatalogo:
      type: object
      required: [id, codigo, nombre, prioridad, aplicaA, datosMinimos, esGenerica, activo, pesoRiesgo]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { type: string, enum: [FISICO, SOCIAL, DIGITAL], description: null solo en la genérica }
        prioridad: { type: integer, minimum: 1, maximum: 5, description: 1 = máxima }
        aplicaA: { type: string, enum: [ALERTA, REPORTE, AMBOS] }
        datosMinimos: { type: array, items: { type: string } }
        esGenerica: { type: boolean }
        activo: { type: boolean }
        pesoRiesgo: { type: number, description: Peso en el mapa de calor }

    CatalogoVigente:
      type: object
      required: [versionCatalogoId, numero, publicadaEn, tipos]
      properties:
        versionCatalogoId: { type: integer }
        numero: { type: integer }
        publicadaEn: { type: string, format: date-time }
        tipos: { type: array, items: { $ref: '#/components/schemas/TipoCatalogo' } }

    VersionCatalogo:
      type: object
      required: [id, numero, estado, creadaEn]
      properties:
        id: { type: integer }
        numero: { type: integer }
        estado: { type: string, enum: [BORRADOR, EN_VALIDACION, PUBLICADA, REEMPLAZADA] }
        creadaEn: { type: string, format: date-time }
        publicadaEn: { type: string, format: date-time }

    PasoEscalamiento:
      type: object
      required: [orden, destinoTipo]
      properties:
        orden: { type: integer }
        destinoTipo: { type: string, enum: [CORPORACION, OPERADOR, COORDINADOR_CIRCULO] }
        corporacionId: { type: integer }
        corporacion: { type: string }
        operadorId: { type: string, format: uuid }

    Problema:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        tipo: { type: string, description: Código del tipo, si el problema es de uno }

    VersionCatalogoDetalle:
      type: object
      required: [version, tipos, errores, advertencias]
      properties:
        version: { $ref: '#/components/schemas/VersionCatalogo' }
        tipos:
          type: array
          items:
            type: object
            required: [tipo]
            properties:
              tipo: { $ref: '#/components/schemas/TipoCatalogo' }
              regla:
                type: object
                required: [corporacionId, corporacion, tiempoMaxAcuseSeg, pasos]
                properties:
                  corporacionId: { type: integer }
                  corporacion: { type: string }
                  tiempoMaxAcuseSeg: { type: integer }
                  pasos: { type: array, items: { $ref: '#/components/schemas/PasoEscalamiento' } }
        errores: { type: array, items: { $ref: '#/components/schemas/Problema' } }
        advertencias: { type: array, items: { $ref: '#/components/schemas/Problema' } }

    TipoEntrada:
      type: object
      required: [nombre, prioridad, aplicaA]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 60 }
        categoria: { type: string, enum: [FISICO, SOCIAL, DIGITAL] }
        prioridad: { type: integer, minimum: 1, maximum: 5 }
        aplicaA: { type: string, enum: [ALERTA, REPORTE, AMBOS] }
        datosMinimos: { type: array, items: { type: string } }
        pesoRiesgo: { type: number, minimum: 0, maximum: 99 }
        activo: { type: boolean, default: true }

    ReglaEntrada:
      type: object
      required: [corporacionId, tiempoMaxAcuseSeg, pasos]
      properties:
        corporacionId: { type: integer }
        tiempoMaxAcuseSeg: { type: integer, minimum: 30, maximum: 600 }
        pasos:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [destinoTipo]
            properties:
              destinoTipo: { type: string, enum: [CORPORACION, OPERADOR, COORDINADOR_CIRCULO] }
              corporacionId: { type: integer }
              operadorId: { type: string, format: uuid }

    # ---------------------------------------------------------------- Trayectos

    TrayectoEntrada:
      type: object
      required: [id, origenLatitud, origenLongitud, destinoLatitud, destinoLongitud, iniciadoEn]
      properties:
        id: { type: string, format: uuid }
        tipoRuta: { type: string, enum: [SEGURA, MAS_CORTA], default: SEGURA }
        origenLatitud: { type: number }
        origenLongitud: { type: number }
        destinoLatitud: { type: number }
        destinoLongitud: { type: number }
        distanciaM: { type: integer }
        duracionEstMin: { type: integer }
        toleranciaDesviacionM: { type: integer }
        intervaloCheckinMin: { type: integer }
        rutaPlanificada: { type: object, description: GeoJSON (LineString o Feature) de la ruta elegida }
        iniciadoEn: { type: string, format: date-time }
        compartir: { type: boolean, default: false }
        estado: { type: string, enum: [EN_CURSO, FINALIZADO, CANCELADO], description: Solo en la cola sin señal }
        finalizadoEn: { type: string, format: date-time, description: Solo en la cola sin señal }
        ultimaLatitud: { type: number, description: Solo en la cola sin señal }
        ultimaLongitud: { type: number, description: Solo en la cola sin señal }
        ultimaUbicacionEn: { type: string, format: date-time, description: Solo en la cola sin señal }

    TrayectoCambio:
      type: object
      properties:
        estado: { type: string, enum: [EN_CURSO, FINALIZADO, CANCELADO] }
        latitud: { type: number }
        longitud: { type: number }
        ubicacionEn: { type: string, format: date-time }
        finalizadoEn: { type: string, format: date-time }

    CheckinEntrada:
      type: object
      required: [esperadoEn]
      properties:
        esperadoEn: { type: string, format: date-time }
        confirmadoEn: { type: string, format: date-time }

    Trayecto:
      type: object
      required: [id, usuarioId, tipoRuta, estado, origenLatitud, origenLongitud, destinoLatitud, destinoLongitud, iniciadoEn, checkins]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        tipoRuta: { type: string, enum: [SEGURA, MAS_CORTA] }
        estado: { type: string, enum: [EN_CURSO, FINALIZADO, CANCELADO] }
        origenLatitud: { type: number }
        origenLongitud: { type: number }
        destinoLatitud: { type: number }
        destinoLongitud: { type: number }
        distanciaM: { type: integer }
        duracionEstMin: { type: integer }
        toleranciaDesviacionM: { type: integer }
        intervaloCheckinMin: { type: integer }
        rutaPlanificada: { type: object }
        ultimaLatitud: { type: number }
        ultimaLongitud: { type: number }
        ultimaUbicacionEn: { type: string, format: date-time }
        iniciadoEn: { type: string, format: date-time }
        finalizadoEn: { type: string, format: date-time }
        checkins: { type: array, items: { $ref: '#/components/schemas/CheckinEntrada' } }

    # ---------------------------------------------------------------- Reportes

    ReporteEntrada:
      type: object
      required: [id, tipoIncidenteId, descripcion, latitud, longitud, creadoEn]
      properties:
        id: { type: string, format: uuid }
        tipoIncidenteId: { type: integer }
        versionCatalogoId: { type: integer }
        descripcion: { type: string, minLength: 10, maxLength: 2000 }
        latitud: { type: number }
        longitud: { type: number }
        precisionM: { type: number }
        esAnonimo: { type: boolean, default: false }
        creadoEn: { type: string, format: date-time }
        evidencias:
          type: array
          maxItems: 3
          items:
            type: object
            required: [clave, mime, tamanoBytes, hashSha256]
            properties:
              clave: { type: string, example: evidencia/5f0c3c7e-1d2b-4c6a-9a51-3f2e8b7d6c10.jpg }
              mime: { type: string }
              tamanoBytes: { type: integer }
              hashSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        tipoSugeridoId: { type: integer, description: Sugerencia de clasificación del teléfono, si la hubo }
        confianzaSugerencia: { type: number, minimum: 0, maximum: 1 }

    ReporteRecibido:
      type: object
      required: [id, folio, estado, celda]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string, example: REP-2026-000001 }
        estado: { type: string }
        celda: { type: string, description: Geohash de 7 caracteres }

    ReportePropio:
      type: object
      required: [id, folio, tipo, descripcion, estado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        tipo: { type: string }
        descripcion: { type: string }
        estado: { type: string, enum: [PENDIENTE, PUBLICADO, RECHAZADO, RETIRADO] }
        creadoEn: { type: string, format: date-time }
        moderadoEn: { type: string, format: date-time }

    ReporteModeracion:
      type: object
      required: [id, folio, tipoIncidenteId, tipo, descripcion, latitud, longitud, celda, latitudPublica, longitudPublica, autor, esAnonimo, estado, creadoEn, recibidoEn, evidencias, decisiones]
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        tipoIncidenteId: { type: integer }
        tipo: { type: string }
        categoria: { type: string }
        descripcion: { type: string }
        latitud: { type: number }
        longitud: { type: number }
        precisionM: { type: number }
        celda: { type: string }
        latitudPublica: { type: number, description: Centro de la celda }
        longitudPublica: { type: number }
        autor: { type: string, description: Nombre del autor, o «Anónimo» }
        esAnonimo: { type: boolean }
        estado: { type: string }
        creadoEn: { type: string, format: date-time }
        recibidoEn: { type: string, format: date-time }
        evidencias:
          type: array
          items:
            type: object
            required: [clave, url, mime, tamanoBytes]
            properties:
              clave: { type: string }
              url: { type: string }
              mime: { type: string }
              tamanoBytes: { type: integer }
        tipoSugeridoId: { type: integer }
        confianzaSugerencia: { type: number }
        decisiones:
          type: array
          items:
            type: object
            required: [decision, decididoEn]
            properties:
              decision: { type: string, enum: [PUBLICAR, RECHAZAR, RETIRAR] }
              motivo: { type: string }
              decididoEn: { type: string, format: date-time }
              unidoAFolio: { type: string }

    DecisionEntrada:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [PUBLICAR, RECHAZAR, RETIRAR] }
        motivo: { type: string, minLength: 5, maxLength: 500, description: Obligatorio al rechazar o retirar }
        unidoAId: { type: string, format: uuid, description: Reporte publicado que ya cuenta lo mismo }
        ocultaDatosPersonales: { type: boolean, default: false }
        referencia: { type: string, maxLength: 160, description: Referencia del lugar que se muestra en el feed }

    IdentidadAutor:
      type: object
      required: [usuarioId, nombre, identificador, telefono, escuela]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        identificador: { type: string }
        telefono: { type: string }
        escuela: { type: string }

    PaginaFeed:
      type: object
      required: [reportes]
      properties:
        reportes:
          type: array
          items:
            type: object
            required: [id, tipoIncidenteId, tipo, descripcion, celda, latitud, longitud, autor, publicadoEn]
            properties:
              id: { type: string, format: uuid }
              tipoIncidenteId: { type: integer }
              tipo: { type: string }
              categoria: { type: string }
              descripcion: { type: string }
              celda: { type: string }
              latitud: { type: number, description: Centro de la celda, no la ubicación exacta }
              longitud: { type: number }
              referencia: { type: string }
              autor: { type: string, description: Nombre o «Anónimo» }
              publicadoEn: { type: string, format: date-time }
              distanciaM: { type: number }
        siguiente: { type: string, description: Cursor de la página que sigue }

    # ---------------------------------------------------------------- Mapa de calor

    Zona:
      type: object
      required: [id, nivel, periodoDias, densidadPonderada, numReportes, centroLatitud, centroLongitud, geometria]
      properties:
        id: { type: integer }
        nivel: { type: string, enum: [BAJO, MEDIO, ALTO] }
        tipoIncidenteId: { type: integer, description: null en las zonas generales }
        periodoDias: { type: integer }
        densidadPonderada: { type: number }
        numReportes: { type: integer }
        centroLatitud: { type: number }
        centroLongitud: { type: number }
        geometria: { type: object, description: 'GeoJSON Polygon en [longitud, latitud]' }

    CapaRiesgo:
      type: object
      required: [version, generadaEn, periodoDias, zonas, leyenda]
      properties:
        version: { type: integer }
        generadaEn: { type: string, format: date-time }
        periodoDias: { type: integer }
        zonas: { type: array, items: { $ref: '#/components/schemas/Zona' } }
        leyenda: { type: string }

    ZonaDetalle:
      type: object
      required: [zona, motivos]
      properties:
        zona: { $ref: '#/components/schemas/Zona' }
        motivos:
          type: array
          items: { type: object, required: [tipo, reportes], properties: { tipo: { type: string }, reportes: { type: integer } } }
        ultimoReporteEn: { type: string, format: date-time }

    GeneracionCapa:
      type: object
      required: [version, zonas, reportes, tramos]
      properties:
        version: { type: integer }
        zonas: { type: integer }
        reportes: { type: integer }
        tramos: { type: integer, description: Tramos del grafo con riesgo }

    # ---------------------------------------------------------------- Ruta segura y mapas

    Coordenada:
      type: object
      required: [latitud, longitud]
      properties:
        latitud: { type: number }
        longitud: { type: number }

    SolicitudRuta:
      type: object
      required: [origen, destino]
      properties:
        origen: { $ref: '#/components/schemas/Coordenada' }
        destino: { $ref: '#/components/schemas/Coordenada' }

    Ruta:
      type: object
      required: [tipo, puntos, distanciaM, duracionMin, riesgoMedio]
      properties:
        tipo: { type: string, enum: [SEGURA, MAS_CORTA] }
        puntos: { type: array, items: { $ref: '#/components/schemas/Coordenada' } }
        distanciaM: { type: number }
        duracionMin: { type: integer }
        riesgoMedio: { type: number, description: Promedio del riesgo de los tramos, ponderado por su largo (0 a 1) }

    RutasSugeridas:
      type: object
      required: [segura, masCorta, advertencias, calculadaEn, explicacion]
      properties:
        segura: { $ref: '#/components/schemas/Ruta' }
        masCorta: { $ref: '#/components/schemas/Ruta' }
        advertencias:
          type: array
          items:
            type: object
            required: [zonaId, nivel, mensaje]
            properties:
              zonaId: { type: integer }
              nivel: { type: string, enum: [MEDIO, ALTO] }
              mensaje: { type: string }
        capaVersion: { type: integer }
        calculadaEn: { type: string, enum: [SERVIDOR] }
        explicacion: { type: string }

    GrafoEntrada:
      type: object
      required: [nodos, aristas]
      properties:
        nodos:
          type: array
          items:
            type: object
            required: [id, latitud, longitud]
            properties:
              id: { type: integer, description: Id del nodo en OpenStreetMap }
              latitud: { type: number }
              longitud: { type: number }
        aristas:
          type: array
          items:
            type: object
            required: [origen, destino]
            properties:
              origen: { type: integer }
              destino: { type: integer }
              nombreVia: { type: string }
              tipoVia: { type: string }
              bidireccional: { type: boolean, default: true }
              osmWayId: { type: integer }

    GrafoCargado:
      type: object
      required: [nodos, aristas, tramosConRiesgo]
      properties:
        nodos: { type: integer }
        aristas: { type: integer }
        tramosConRiesgo: { type: integer }

    Grafo:
      type: object
      required: [nodos, aristas]
      properties:
        capaVersion: { type: integer }
        nodos:
          type: array
          items: { type: object, required: [id, latitud, longitud], properties: { id: { type: integer }, latitud: { type: number }, longitud: { type: number } } }
        aristas:
          type: array
          items:
            type: object
            required: [id, origen, destino, longitudM, bidireccional, riesgo]
            properties:
              id: { type: integer }
              origen: { type: integer }
              destino: { type: integer }
              longitudM: { type: number }
              bidireccional: { type: boolean }
              riesgo: { type: number, description: '0 sin riesgo; 0.3 BAJO, 0.6 MEDIO, 1 ALTO' }

    PaqueteMapa:
      type: object
      required: [id, region, version, minLatitud, minLongitud, maxLatitud, maxLongitud, tamanoBytes, hashSha256, url, publicadoEn]
      properties:
        id: { type: integer }
        region: { type: string }
        version: { type: string }
        minLatitud: { type: number }
        minLongitud: { type: number }
        maxLatitud: { type: number }
        maxLongitud: { type: number }
        tamanoBytes: { type: integer }
        hashSha256: { type: string }
        url: { type: string }
        publicadoEn: { type: string, format: date-time }

    PaqueteEntrada:
      type: object
      required: [region, version, minLatitud, minLongitud, maxLatitud, maxLongitud, clave, tamanoBytes, hashSha256]
      properties:
        region: { type: string, minLength: 3, maxLength: 100 }
        version: { type: string, minLength: 1, maxLength: 20 }
        minLatitud: { type: number }
        minLongitud: { type: number }
        maxLatitud: { type: number }
        maxLongitud: { type: number }
        clave: { type: string, description: 'Lo que respondió POST /archivos/mapa (mapa/<uuid>.zip o .bin)' }
        tamanoBytes: { type: integer }
        hashSha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    VersionesMapas:
      type: object
      required: [paquetes]
      properties:
        capaRiesgo: { type: integer }
        catalogo: { type: integer }
        paquetes:
          type: array
          items: { type: object, required: [region, version], properties: { region: { type: string }, version: { type: string } } }

    PuntoInteres:
      type: object
      required: [id, nombre, tipo, latitud, longitud]
      properties:
        id: { type: integer }
        nombre: { type: string }
        tipo: { type: string, example: CASETA }
        latitud: { type: number }
        longitud: { type: number }

    PuntoInteresEntrada:
      type: object
      required: [nombre, tipo, latitud, longitud]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 150 }
        tipo: { type: string, minLength: 3, maxLength: 40 }
        latitud: { type: number }
        longitud: { type: number }

    ZonaGeografica:
      type: object
      required: [id, nombre, minLatitud, minLongitud, maxLatitud, maxLongitud]
      properties:
        id: { type: integer }
        nombre: { type: string }
        minLatitud: { type: number }
        minLongitud: { type: number }
        maxLatitud: { type: number }
        maxLongitud: { type: number }

    ZonaGeograficaEntrada:
      type: object
      required: [nombre, minLatitud, minLongitud, maxLatitud, maxLongitud]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100 }
        minLatitud: { type: number }
        minLongitud: { type: number }
        maxLatitud: { type: number }
        maxLongitud: { type: number }
