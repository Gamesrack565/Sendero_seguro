# Servicios para desarrollo local: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: sendero-postgres
    environment:
      POSTGRES_DB: sendero_seguro
      POSTGRES_PASSWORD: sendero
    ports:
      - "5432:5432"
    volumes:
      - sendero-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sendero-redis
    ports:
      - "6379:6379"

  # Almacén de archivos compatible con S3 (fotos, audios y exportaciones).
  # Consola web: http://localhost:9001 (usuario sendero, contraseña sendero-s3)
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: sendero-s3
    environment:
      RUSTFS_ACCESS_KEY: sendero
      RUSTFS_SECRET_KEY: sendero-s3
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sendero-s3:/data

volumes:
  sendero-postgres:
  sendero-s3: