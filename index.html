<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sendero Seguro</title>
<meta name="description" content="Descarga la app Android de Sendero Seguro.">
<meta name="theme-color" content="#D73345">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;125,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Paleta de la guía de estilo de la app (E3) */
  :root {
    --rojo: #D73345; --rojo-osc: #9E1B2B; --halo: #F9D6DA;
    --tinta: #281620; --malva: #925E78; --lila: #E5A1E5; --lila-tinte: #F9E8F9;
    --fondo: #F2EDEB; --texto2: #7A4E64;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #1E1218; --tinta: #F6EEF2; --texto2: #CDB0BF; --lila-tinte: #3A2533; --halo: #4A1F2A; }
  }
  :root[data-theme="dark"] { --fondo: #1E1218; --tinta: #F6EEF2; --texto2: #CDB0BF; --lila-tinte: #3A2533; --halo: #4A1F2A; }

  * { box-sizing: border-box; }
  /* Una sola pantalla, sin desplazamiento: todo se ajusta al alto disponible */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background:
      radial-gradient(60vmax 60vmax at 50% 58%, var(--lila-tinte) 0%, transparent 62%),
      var(--fondo);
    color: var(--tinta);
    font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  main {
    --boton: min(228px, 27vh, 60vw);
    height: 100vh; height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    padding: clamp(16px, 4vh, 40px) 16px clamp(12px, 3vh, 28px);
    position: relative;
  }

  .encabezado { align-self: end; text-align: center; }
  .marca {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase;
    color: var(--malva); margin-bottom: clamp(8px, 2vh, 18px);
  }
  .marca svg { width: 16px; height: 16px; }
  h1 {
    margin: 0;
    font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 125%;
    font-size: clamp(36px, min(9vw, 10vh), 104px); line-height: .92; letter-spacing: -.02em;
  }
  h1 span { color: var(--rojo); }
  .lema { margin: clamp(8px, 2vh, 18px) auto 0; max-width: 30ch; font-size: clamp(17px, 2vw, 20px); color: var(--texto2); }

  /* Firma: el botón de descarga es el botón de pánico de la app, con la señal de la malla saliendo de él */
  .escena { position: relative; width: min(980px, 100%); display: grid; place-items: center; margin: clamp(10px, 4vh, 48px) 0; }
  .boton-zona { position: relative; width: calc(var(--boton) * 1.32); height: calc(var(--boton) * 1.32); display: grid; place-items: center; }
  .onda {
    position: absolute; inset: 0; margin: auto; width: var(--boton); height: var(--boton); border-radius: 50%;
    border: 2px solid var(--rojo); opacity: 0; pointer-events: none;
    animation: onda 3.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .onda:nth-child(2) { animation-delay: 1.2s; }
  .onda:nth-child(3) { animation-delay: 2.4s; }
  @keyframes onda { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.3); opacity: 0; } }

  .descargar {
    position: relative; z-index: 2;
    width: var(--boton); height: var(--boton); border-radius: 50%;
    display: grid; place-content: center; gap: 6px; text-align: center; text-decoration: none;
    background: var(--rojo); color: #fff;
    box-shadow: 0 0 0 calc(var(--boton) * .07) var(--halo), 0 24px 50px rgba(158, 27, 43, .35);
    transition: transform .25s ease, background .25s ease;
  }
  .descargar:hover { transform: scale(1.04); background: #C92A3C; }
  .descargar:active { transform: scale(.97); background: var(--rojo-osc); }
  .descargar:focus-visible { outline: 3px solid var(--tinta); outline-offset: 22px; }
  .descargar svg { width: calc(var(--boton) * .15); height: calc(var(--boton) * .15); justify-self: center; }
  .descargar strong {
    font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 125%;
    font-size: calc(var(--boton) * .096); line-height: 1; letter-spacing: .02em;
  }
  .descargar small { font-size: max(12px, calc(var(--boton) * .061)); opacity: .9; }

  /* Pantallas reales de la app, a los lados del botón */
  .pantalla {
    position: absolute; top: 50%; width: min(190px, 26vh); border-radius: 26px;
    border: 6px solid #281620; background: #281620;
    box-shadow: 0 30px 60px rgba(40, 22, 32, .25);
    overflow: hidden;
  }
  .pantalla img { display: block; width: 100%; }
  .izq { left: 4%; transform: translateY(-50%) rotate(-8deg); }
  .der { right: 4%; transform: translateY(-46%) rotate(7deg); }

  .pie { align-self: start; text-align: center; color: var(--texto2); font-size: 15px; }
  .datos { font: 500 13px/1.6 "JetBrains Mono", monospace; letter-spacing: .03em; }
  .datos b { color: var(--tinta); font-weight: 500; }
  .pie p { margin: clamp(4px, 1vh, 10px) auto 0; max-width: 42ch; }

  @media (max-width: 860px) {
    .pantalla { display: none; }
  }
  @media (max-height: 560px) {
    .pie p { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .onda { animation: none; opacity: .18; transform: scale(1.35); }
    .onda:nth-child(2) { transform: scale(1.7); opacity: .1; }
    .onda:nth-child(3) { display: none; }
    .descargar { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header class="encabezado">
    <div class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/></svg>
      ESCOM · IPN
    </div>
    <h1>Sendero<br><span>Seguro</span></h1>
    <p class="lema">Pide ayuda con un toque, con o sin señal.</p>
  </header>

  <div class="escena">
    <figure class="pantalla izq" aria-hidden="true"><img src="pagina/a07.jpg" alt=""></figure>
    <div class="boton-zona">
      <span class="onda"></span><span class="onda"></span><span class="onda"></span>
      <a class="descargar" href="https://github.com/Gamesrack565/Sendero_seguro/releases/latest/download/SenderoSeguro.apk" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
        <strong>DESCARGAR</strong>
        <small>App para Android</small>
      </a>
    </div>
    <figure class="pantalla der" aria-hidden="true"><img src="pagina/a17.jpg" alt=""></figure>
  </div>

  <footer class="pie">
    <div class="datos"><b>v0.2.0</b> · APK 57 MB · Android 8.0 o superior</div>
    <p>Al abrir el archivo, Android puede pedirte permitir la instalación desde este origen.</p>
  </footer>
</main>
</body>
</html>
