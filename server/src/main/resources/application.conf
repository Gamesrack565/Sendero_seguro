# Configuración del servidor. Cada valor se puede reemplazar con una variable de entorno
# (la línea con ${?VARIABLE}). En la nube se usan variables; nunca se suben secretos al repo.
ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.senderoseguro.server.ApplicationKt.module ]
  }
}

db {
  url = "jdbc:postgresql://localhost:5432/sendero_seguro"
  url = ${?DB_URL}
  usuario = "postgres"
  usuario = ${?DB_USUARIO}
  password = "sendero"
  password = ${?DB_PASSWORD}
  poolMax = 10
  poolMax = ${?DB_POOL_MAX}
  # Carga usuarios, unidades y operadores de prueba. En la nube: DB_DATOS_PRUEBA=false
  datosPrueba = true
  datosPrueba = ${?DB_DATOS_PRUEBA}
}

dispersion {
  # Cada cuántos segundos se buscan alertas con el plazo de acuse vencido.
  revisionSeg = 5
  revisionSeg = ${?DISPERSION_REVISION_SEG}
}

enlace {
  # Llave para calcular los tokens de los enlaces de ubicación. En la nube se define ENLACE_SECRETO.
  secreto = "solo-para-desarrollo-enlaces"
  secreto = ${?ENLACE_SECRETO}
  # Vigencia máxima del enlace; antes deja de funcionar al cerrar o cancelar la alerta.
  horasMax = 24
  horasMax = ${?ENLACE_HORAS_MAX}
}

jwt {
  # Solo para desarrollo. En la nube se define JWT_SECRETO.
  secreto = "solo-para-desarrollo-cambiar-en-la-nube"
  secreto = ${?JWT_SECRETO}
  emisor = "sendero-seguro"
  audiencia = "sendero-seguro-api"
}
