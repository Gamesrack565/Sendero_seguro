# Configuración del servidor. Cada valor se puede reemplazar con una variable de entorno
# (la línea con ${?VARIABLE}). En la nube se usan variables; nunca se suben secretos al repo.
ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.senderoseguro.server.ApplicationKt.module ]
  }
}

db {
  url = "jdbc:postgresql://localhost:5432/sendero_seguro"
  url = ${?DB_URL}
  usuario = "postgres"
  usuario = ${?DB_USUARIO}
  password = "sendero"
  password = ${?DB_PASSWORD}
  poolMax = 10
  poolMax = ${?DB_POOL_MAX}
  # Carga usuarios, unidades y operadores de prueba. En la nube: DB_DATOS_PRUEBA=false
  datosPrueba = true
  datosPrueba = ${?DB_DATOS_PRUEBA}
}

dispersion {
  # Cada cuántos segundos se buscan alertas con el plazo de acuse vencido.
  revisionSeg = 5
  revisionSeg = ${?DISPERSION_REVISION_SEG}
}

enlace {
  # Llave para calcular los tokens de los enlaces de ubicación. En la nube se define ENLACE_SECRETO.
  secreto = "solo-para-desarrollo-enlaces"
  secreto = ${?ENLACE_SECRETO}
  # Vigencia máxima del enlace; antes deja de funcionar al cerrar o cancelar la alerta.
  horasMax = 24
  horasMax = ${?ENLACE_HORAS_MAX}
  # Dirección pública del WebSocket del enlace, sin el token. En la nube: wss://<dominio>/api/v1/ws/enlace
  urlWebSocket = "ws://localhost:8080/api/v1/ws/enlace"
  urlWebSocket = ${?ENLACE_URL_WEBSOCKET}
}

avisos {
  # Proveedor de cada canal. "simulado" solo escribe el mensaje en el log (local y pruebas).
  proveedorPush = "simulado"
  proveedorPush = ${?AVISOS_PROVEEDOR_PUSH}
  # Con proveedorPush = "fcm": ruta del .json de la cuenta de servicio de Firebase (fuera del repo).
  fcmCredenciales = ""
  fcmCredenciales = ${?FCM_CREDENCIALES}
  # "simulado" o "twilio" (necesita la sección twilio).
  proveedorSms = "simulado"
  proveedorSms = ${?AVISOS_PROVEEDOR_SMS}
  # Reintentos (E-03): después de maxReintentos fallas el aviso queda DESCARTADO.
  maxReintentos = 5
  maxReintentos = ${?AVISOS_MAX_REINTENTOS}
  # Espera antes del primer reintento; se duplica en cada falla (15 s, 30 s, 1 min, 2 min...).
  esperaBaseSeg = 15
  esperaBaseSeg = ${?AVISOS_ESPERA_BASE_SEG}
  # Cada cuántos milisegundos se buscan avisos por enviar.
  revisionMs = 2000
  revisionMs = ${?AVISOS_REVISION_MS}
  # Página que abre la red de apoyo desde el SMS o el push, sin el token.
  urlEnlace = "http://localhost:8080/api/v1/enlace"
  urlEnlace = ${?AVISOS_URL_ENLACE}
}

twilio {
  # Datos de la cuenta (Console de Twilio → Account Info). El Auth Token es secreto: solo en variable de entorno.
  accountSid = ""
  accountSid = ${?TWILIO_ACCOUNT_SID}
  authToken = ""
  authToken = ${?TWILIO_AUTH_TOKEN}
  # Número de Twilio que manda y recibe los SMS, en formato internacional (+1...).
  numero = ""
  numero = ${?TWILIO_NUMERO}
}

pasarela {
  # Dirección pública del servidor hasta /api/v1 (por ejemplo https://<dominio>/api/v1). Con ella se valida la firma
  # de los webhooks de Twilio y se le pide avisar la entrega de cada SMS. Vacía: solo pruebas locales.
  urlPublica = ""
  urlPublica = ${?PASARELA_URL_PUBLICA}
}

tiempoReal {
  # Cada cuántos milisegundos se buscan cambios nuevos para la consola y el enlace.
  revisionMs = 1000
  revisionMs = ${?TIEMPO_REAL_REVISION_MS}
}

jwt {
  # Solo para desarrollo. En la nube se define JWT_SECRETO.
  secreto = "solo-para-desarrollo-cambiar-en-la-nube"
  secreto = ${?JWT_SECRETO}
  emisor = "sendero-seguro"
  audiencia = "sendero-seguro-api"
}
